 thing.", "These next minutes belong entirely to you. Not to the illness, not to anyone who needs something from you. Only to you.", "Your mind will wander during this session. That is normal, and it is not failure. When it wanders, simply notice, and bring it back here. It will wander again — and again, you bring it back. Every single time, gently, and without any frustration.", "You are worth this time. Let us begin.", "Welcome. This is the final session of the advanced group, and I want it to feel like what it is — a culmination, a celebration, and a sending forward.", "Today we are going to look at the full arc, of what it means to live with pulmonary hypertension. Not the medical arc — the human one. The inner one, that does not appear in any chart or test result, but that has been the real story, through all of this.", "And at the center of that story, I want to place one thing. A choice. The same choice, made again and again, in different circumstances, under different conditions, with different amounts of energy and hope and certainty available.", "The choice to keep going.", "Find your position, for this final long session. Let your body be completely supported, and completely at ease.", "BREATH_IN:Take a very slow breath in... and as the air arrives, feel the full weight of everything you have carried, to get to this moment... all of it...", "BREATH_BELLY_OUT:And breathe out slowly... and feel the full weight of what you have given, to keep going through it... equally acknowledged...", "I want to take you back. Not to the worst moments, not to dwell in them, but to acknowledge them honestly, before we move through them.", "Think of the day the diagnosis arrived, or the days of not-yet-knowing that preceded it. The particular quality of that fear. The reorganisation of the future, that happened in a single conversation. The way the world looked different, walking out of the doctor's office, than it had looked walking in.", "You were there for that. You experienced it. And you kept going.", "Think of the first difficult treatment, or the first time a medication stopped working, or the first result worse than the last. The particular grief of those moments. The way hope had to be rebuilt, again and again, from a different starting point.", "You were there for those moments too. You felt all of it. And you kept going.", "BREATH_IN:Breathe in slowly... and honor every one of those moments... they were real, and they cost something real, and you came through all of them...", "BREATH_BELLY_OUT:And breathe out... releasing any sense that coming through them was ordinary... it was not ordinary... it was extraordinary, and it was yours...", "Now I want to move forward, from those difficult moments, to the ordinary ones. Because the ordinary ones are where the real story lives.", "The ordinary morning, when you woke up and chose to engage with the day. The ordinary appointment, attended when canceling would have been easier. The ordinary conversation, where you showed up and were present, even when presence was costing energy you did not fully have.", "The ordinary Tuesday. The ordinary afternoon. The ordinary moment of deciding, again, without fanfare, without applause, without anyone marking it as significant — to continue.", "That choice, made in ordinary moments, is the most significant thing about you. More significant than any achievement, or any capacity, or any measure of what you can do. The fact that you keep choosing, in ordinary moments, to be here, and to live your life — that is the whole story.", "BREATH_IN:Breathe in steadily... and let this breath honor every ordinary moment, in which you quietly chose to continue...", "BREATH_BELLY_OUT:And breathe out... releasing any tendency to minimise that choice... it is not small... it is the whole thing...", "I want to say something about the word warrior, because we have used it throughout this app, and I want to make sure it sits right.", "A warrior, as I mean it here, is not someone who is always strong, or always certain, or always moving forward without doubt or difficulty or the occasional desperate wish that things were different.", "A warrior is someone who shows up. In whatever form showing up takes, on any given day. Sometimes with energy and clarity and purpose. Sometimes barely, exhaustedly, with very little available. But showing up. Choosing the day. Choosing to be present.", "That is you. That has always been you. Even on the days when it did not feel like enough, it was enough. It was, in fact, everything.", "BREATH_IN:Breathe in slowly... and feel the full truth of your warrior identity... not as performance, but as the simple, factual description of how you have lived...", "BREATH_BELLY_OUT:And breathe out... and let yourself receive that truth without deflecting it, without qualifying it, without making it smaller than it is...", "There is something I want to offer you, to carry forward from this session, and from this app, and from all the work you have done in listening to these sessions and sitting with these ideas.", "Your life is not a diminished version of a better life. It is its own thing, with its own particular depth, its own particular wisdom, and its own particular form of courage, that most people will never be called upon to demonstrate.", "You have been called upon to demonstrate it, every single day, and every single day, you have done so.", "The illness is part of your story. It is a significant part. But it is not the whole story, and it is not the most important part. The most important part is this. The choice. Made quietly, in ordinary moments, without recognition, without guarantee of anything in return. The choice to live, fully, in whatever form fullness is available.", "BREATH_IN:One last long breath in... for the warrior that you are... for the life that you have chosen... for every ordinary morning that you decided to show up...", "BREATH_BELLY_OUT:And breathe out... slowly... completely... and let yourself rest in the knowledge that you have done something remarkable... simply by continuing...", "Let us close in silence, for these final breaths.", "BREATH_IN:In... warrior...", "BREATH_BELLY_OUT:Out... at peace...", "BREATH_IN:In... grateful...", "BREATH_BELLY_OUT:Out... complete...", "Gently now — this session is complete, and this group is complete. You chose life today, as you always do. That is the whole story. And it is a beautiful one."], "introCount": 8}], "c1": "#6FD6E8", "c2": "#3D8FA8"}, {"group": "Low Energy Mode", "icon": "🍃", "sessions": [{"title": "Just One Breath", "duration": "5 minutes", "paragraphs": ["Before we begin, I want you to do one small thing, with me.", "Stop. Just for a moment, stop, wherever your mind has been.", "It does not matter where it was — in tomorrow's worries, in something unfinished, in a conversation that is still replaying. Whatever it was holding, it can wait. Just for these few minutes, it can wait.", "Now, look around you, slowly. Notice what you can see, without judging any of it. Notice what you can hear, near you, and far away. Feel the surface beneath you, solid, and steady, and real.", "You are here. And right now, in this moment, nothing else is required of you. Not one single thing.", "These next minutes belong entirely to you. Not to the illness, not to anyone who needs something from you. Only to you.", "Your mind will wander during this session. That is normal, and it is not failure. When it wanders, simply notice, and bring it back here. It will wander again — and again, you bring it back. Every single time, gently, and without any frustration.", "You are worth this time. Let us begin.", "Just one breath.", "That is all I am asking of you right now. Not ten breaths. Not a full meditation. Not any effort at all beyond this single, quiet moment.", "Just... one... breath.", "Wherever you are right now — lying down, sitting, leaning back against a pillow — let your body be exactly as heavy as it needs to be. You do not need to sit up straight. You do not need to adjust yourself. You do not need to be comfortable in any particular way.", "Just be exactly where you are.", "Let your hands rest open, palms facing upward. Let your jaw unclench. Feel your shoulders drop — perhaps just a little — away from your ears.", "There is nothing to do right now. Nothing to manage. Nothing to solve. No one is waiting for anything from you in this moment.", "BREATH_IN:Now let a breath come in... very softly... as gently as air entering a quiet room through an open window...", "BREATH_OUT:And let it go... slowly... all the way out... let every last bit of air leave your body... completely...", "That breath. That one single breath. Was enough.", "You did something good just now. You stopped. You chose to be here. You chose rest over urgency. You chose yourself.", "And for someone living with pulmonary hypertension — someone whose body works harder than most people will ever understand — that choice is not small. That choice is everything.", "Because for you, rest is not laziness. Rest is not giving up. Rest is medicine. Rest is your body doing the most important work it can possibly do — conserving energy, restoring calm, preparing quietly for the next moment.", "So let this moment be only this. Just you. Just this breath. Just now.", "Nothing else is required.", "BREATH_IN:One more breath in... easy... no pressure anywhere in your chest or your belly... just let the air arrive naturally...", "BREATH_OUT:And out... long... quiet... like a wave that has reached the shore and is now gently returning to the sea...", "Good. Stay here a moment.", "If thoughts come — about tomorrow, about your health, about the things you should be doing right now — just notice them. The way you would notice a cloud passing slowly outside a window on a still afternoon.", "You do not need to chase the cloud. You do not need to push it away. You do not need to do anything about it at all. It will pass on its own. It always does.", "You are allowed to simply exist right now. Without justification. Without achievement. Without proving anything to anyone, including yourself.", "You are a person who is resting. And that is a complete, whole, sufficient thing to be.", "BREATH_IN:One final breath in... gently... feel your belly rise softly with the inhale...", "BREATH_OUT:And out... slowly... completely... let your whole body settle into wherever you are resting... fully supported... fully at rest...", "You are still here.", "You are still breathing.", "You are still in your story.", "And right now, in this moment, that is everything.", "Rest now. You have earned this."], "introCount": 8}, {"title": "Rest Is Enough", "duration": "5 minutes", "paragraphs": ["Before we begin, I want you to do one small thing, with me.", "Stop. Just for a moment, stop, wherever your mind has been.", "It does not matter where it was — in tomorrow's worries, in something unfinished, in a conversation that is still replaying. Whatever it was holding, it can wait. Just for these few minutes, it can wait.", "Now, look around you, slowly. Notice what you can see, without judging any of it. Notice what you can hear, near you, and far away. Feel the surface beneath you, solid, and steady, and real.", "You are here. And right now, in this moment, nothing else is required of you. Not one single thing.", "These next minutes belong entirely to you. Not to the illness, not to anyone who needs something from you. Only to you.", "Your mind will wander during this session. That is normal, and it is not failure. When it wanders, simply notice, and bring it back here. It will wander again — and again, you bring it back. Every single time, gently, and without any frustration.", "You are worth this time. Let us begin.", "You are resting right now.", "And I want to say something to you clearly, directly, and with complete conviction.", "Resting. Is. Enough.", "Not resting so you can do more later. Not resting as a strategy to recover faster. Not resting until you feel better so you can get back to being productive.", "Just resting. As a complete, whole, sufficient act in itself. The entire point. The whole purpose. Enough.", "For those of us living with pulmonary hypertension, there is often a voice — persistent, familiar, a little unkind — that says rest is a luxury. That rest is falling behind. That rest means something is wrong with you beyond what is already wrong.", "That voice is mistaken. And today, gently but firmly, we are going to set it aside.", "BREATH_IN:Let a soft breath come in... feel your belly rise gently... no forcing, no effort...", "BREATH_OUT:And release it slowly... completely... feel your body sink a little deeper into wherever you are resting right now...", "Here is what is actually happening in your body right now while you rest.", "Your heart is beating. Your lungs are moving air. Your blood is carrying oxygen to every cell, doing extraordinary, complex, continuous work without any instruction from your conscious mind.", "Your body is not idle. Your body is working for you. Quietly. Faithfully. Without complaint.", "The very least you can do — the kindest thing you can offer in return — is let your mind take a break too.", "So here, in this moment, I am officially giving you full permission.", "Permission to not be productive right now.", "Permission to not check on anything.", "Permission to not plan, not worry, not prepare for whatever comes next.", "Permission to simply be a human being who is resting — and to let that be the entire story of this moment.", "BREATH_IN:Breathe in again... gently and slowly... feel the air fill you from the inside...", "BREATH_OUT:And out... a little longer than the inhale... let everything soften as you exhale...", "Notice how your body feels right now. Not to fix anything. Not to assess or diagnose or worry. Just to notice, with simple curiosity and kindness.", "Perhaps there is heaviness in your arms or legs. That is fatigue. And fatigue deserves to be acknowledged — not pushed through, not apologized for. Just seen.", "Perhaps there is tightness somewhere in your chest. Breathe toward it softly. Not to dissolve it by force. Just to say quietly: I see you. I am not fighting you right now. I am simply here with you.", "You have been carrying a great deal. You carry it every single day. The weight of managing a body that requires constant attention. The weight of staying present and functional in a life that did not pause when you got sick.", "Today, in this moment, you do not have to carry any of it.", "BREATH_IN:One more slow breath in... warm and steady...", "BREATH_OUT:And out... releasing everything you do not need to hold right now... letting it all go...", "You are not wasting time by resting. You are restoring yourself. And restoration is not a detour from your life. It is the very thing that makes the rest of your life possible.", "Rest fully. You have earned this completely."], "introCount": 8}, {"title": "Hospital Waiting Room Calm", "duration": "5 minutes", "paragraphs": ["Before we begin, I want you to do one small thing, with me.", "Stop. Just for a moment, stop, wherever your mind has been.", "It does not matter where it was — in tomorrow's worries, in something unfinished, in a conversation that is still replaying. Whatever it was holding, it can wait. Just for these few minutes, it can wait.", "Now, look around you, slowly. Notice what you can see, without judging any of it. Notice what you can hear, near you, and far away. Feel the surface beneath you, solid, and steady, and real.", "You are here. And right now, in this moment, nothing else is required of you. Not one single thing.", "These next minutes belong entirely to you. Not to the illness, not to anyone who needs something from you. Only to you.", "Your mind will wander during this session. That is normal, and it is not failure. When it wanders, simply notice, and bring it back here. It will wander again — and again, you bring it back. Every single time, gently, and without any frustration.", "You are worth this time. Let us begin.", "You are waiting.", "Maybe in a hospital corridor. Maybe outside a doctor's cabin. Maybe in a diagnostic center, holding a token, watching the numbers change slowly on a board above the door.", "Waiting rooms carry a particular kind of weight. They are full of people, and yet each person is completely alone inside their own private world of worry. The chairs are the same. The walls are the same. But what each person is carrying is entirely their own.", "I want to sit here with you right now. Not to tell you that everything will be fine — because I do not know that, and you do not either, and pretending otherwise would not actually help you.", "But I can offer you something real. Something you can use right now, in this chair, in this moment, in this body.", "I can help you be here — fully, steadily, calmly — until the waiting is done.", "BREATH_IN:Start by feeling both your feet flat on the floor. Press them down gently. Feel the solid surface beneath you. The floor is real. The floor is steady. You are here, and you are supported. Now a gentle breath in through your nose...", "BREATH_OUT:And out through slightly parted lips... slow... a little longer than the in-breath... let your shoulders drop just slightly as you exhale...", "Good. That was a signal to your nervous system that you are safe right now.", "Let us ground you a little more firmly in this room.", "Without moving from your seat — look around slowly and find five things you can see. A chair. A wall. A door. A light fitting on the ceiling. Another person sitting quietly nearby. Just notice each one. Name it silently inside. These things are real, and steady, and they are here with you.", "Now notice three things you can hear. Perhaps distant footsteps in a corridor. Muffled voices somewhere behind a door. The soft sound of pages turning. Just sounds. They are happening around you. But they are not inside you.", "BREATH_IN:Breathe in softly... let the breath come naturally, without effort...", "BREATH_OUT:And out... slowly... let the sounds stay outside you where they belong...", "Now I want you to say these words silently, inside your own heart. Not out loud. Just for you.", "I am here because I am taking care of myself. That decision took courage.", "I have been to appointments before. I have sat in rooms like this before. And I have come through every single one of them.", "Whatever this result shows — I will deal with it when I know. Not before. Not right now.", "Right now I am sitting. I am breathing. I am managing this moment. And that is all that is being asked of me.", "BREATH_IN:One more breath in... gently... let it come without effort...", "BREATH_OUT:And out... releasing the tight grip of anticipation... letting time move at its own pace... without resistance...", "You do not have to know the result before the doctor tells you.", "You do not have to solve anything in this waiting room.", "You just have to wait. And you are already doing that. You are already here. You already came.", "That was the hardest part. Getting yourself here. You did that.", "The rest is just time passing. And you can let time pass.", "You are doing well. Right here. Right now. Exactly as you are."], "introCount": 8}, {"title": "I Don't Need To Be Productive Today", "duration": "5 minutes", "paragraphs": ["Before we begin, I want you to do one small thing, with me.", "Stop. Just for a moment, stop, wherever your mind has been.", "It does not matter where it was — in tomorrow's worries, in something unfinished, in a conversation that is still replaying. Whatever it was holding, it can wait. Just for these few minutes, it can wait.", "Now, look around you, slowly. Notice what you can see, without judging any of it. Notice what you can hear, near you, and far away. Feel the surface beneath you, solid, and steady, and real.", "You are here. And right now, in this moment, nothing else is required of you. Not one single thing.", "These next minutes belong entirely to you. Not to the illness, not to anyone who needs something from you. Only to you.", "Your mind will wander during this session. That is normal, and it is not failure. When it wanders, simply notice, and bring it back here. It will wander again — and again, you bring it back. Every single time, gently, and without any frustration.", "You are worth this time. Let us begin.", "Say it quietly to yourself — even if a part of you resists.", "I do not need to be productive today.", "Notice what happens inside when you say those words. Does something tighten? Does a familiar voice say — but there are things waiting, messages to reply to, people depending on me, things I said I would do?", "That voice is real. It has been loyal to you. It has kept you going on days when stopping would have been so much easier. It deserves acknowledgment.", "But today — just for these few minutes — we are going to gently, kindly, ask it to rest alongside you.", "Because here is what I know about you, and what I want you to actually hear.", "You are a person managing a serious, complex, chronic health condition. Every single day, you make decisions that most people around you will never need to think about. How to pace yourself. How to manage your energy. When to push and when to stop. How to show up for your life while also managing everything your body requires of you.", "You take medications. You track how you feel. You attend appointments that other people your age have never heard of. You carry knowledge about your own body that took years of difficult experience to accumulate.", "And you still show up. Every day. To your work, to your relationships, to your responsibilities.", "That is not a small thing. That is extraordinary. That is, in fact, one of the most demanding and disciplined ways a human being can live.", "BREATH_IN:Let a breath come in... easy... soft... no effort needed...", "BREATH_OUT:And release it slowly... let your body be heavy and completely at rest...", "Now I want you to do something. Think of one thing you were supposed to do today that you have not done. Just one thing.", "Now imagine holding that thing gently in your hands. Not gripping it. Not throwing it away. Just holding it, the way you would hold something you intend to put down carefully.", "Now place it — gently, without guilt — into a box. Close the lid. Put the box on a shelf.", "It will be there. It will wait. It is not going anywhere. And you will get to it when you are ready. But right now, in this moment, it does not need to be in your hands.", "BREATH_IN:Breathe in softly... feel a small, quiet sense of relief in your chest...", "BREATH_OUT:And out... let the weight of that one undone thing dissolve completely for now...", "Your worth has never been measured by your output. Not really. Not in any way that actually matters.", "But living with PH can quietly convince you that you have to earn your place — by doing, by contributing, by never letting the illness slow you down too visibly.", "You do not have to earn your place. You already belong here.", "You are enough when you do nothing. You are enough when you rest. You are enough when you simply exist in this body, taking up your full and rightful space in the world.", "Fully. Completely. Without conditions. Right now.", "You are enough. Exactly as you are. Today."], "introCount": 8}, {"title": "Five Minutes Of Peace", "duration": "5 minutes", "paragraphs": ["Before we begin, I want you to do one small thing, with me.", "Stop. Just for a moment, stop, wherever your mind has been.", "It does not matter where it was — in tomorrow's worries, in something unfinished, in a conversation that is still replaying. Whatever it was holding, it can wait. Just for these few minutes, it can wait.", "Now, look around you, slowly. Notice what you can see, without judging any of it. Notice what you can hear, near you, and far away. Feel the surface beneath you, solid, and steady, and real.", "You are here. And right now, in this moment, nothing else is required of you. Not one single thing.", "These next minutes belong entirely to you. Not to the illness, not to anyone who needs something from you. Only to you.", "Your mind will wander during this session. That is normal, and it is not failure. When it wanders, simply notice, and bring it back here. It will wander again — and again, you bring it back. Every single time, gently, and without any frustration.", "You are worth this time. Let us begin.", "Five minutes.", "Just five minutes that belong entirely and completely to you.", "Not to your diagnosis. Not to your responsibilities. Not to anyone who is waiting for something from you. Not to the version of yourself who manages everything and keeps everything together.", "Just five quiet minutes. Offered to yourself. As a gift. Without conditions.", "Close your eyes gently if that feels right. Or let your gaze fall soft and unfocused, resting on nothing in particular, seeing without really looking.", "And now — let your body be heavy.", "Completely. Fully. Unapologetically heavy.", "Let the surface beneath you — the bed, the chair, the floor — take every bit of that weight. You have been holding yourself up for a long time. You can let go now. You are supported. You do not need to hold anything.", "BREATH_IN:Breathe in gently... feel the air arrive without any effort at all... just let it come...", "BREATH_OUT:And out... slowly... let the weight of the whole day leave with that breath...", "Now I want you to imagine a place.", "It can be real or imagined. A place you have been and loved and kept quietly in your heart. Or a place that only exists inside you, built from pieces of beauty you have gathered over the years.", "A quiet beach at the very beginning of morning, before anyone else has arrived. A familiar room filled with warm, golden light. A garden after gentle rain, the air still cool and clean. A simple, safe, beloved corner somewhere that has always felt like home.", "Let yourself be there now. See the light of that place. Notice whether it is the warm soft gold of early morning, or the pale silver of a calm evening sky. Notice the sounds — or perhaps the beautiful, deep silence. Feel the air of that place on your skin.", "You are there. You are safe. Nothing requires anything of you here.", "BREATH_IN:Breathe in... and imagine breathing in the air of that peaceful place... clean and calm and completely yours...", "BREATH_OUT:And out... releasing whatever you have been carrying that you no longer need...", "In this place, your pulmonary hypertension is simply one part of your story. The way the colour of your eyes is part of your story. It is real, it is there, but it does not own this moment.", "Here, you are simply a person at rest. Breathing gently. Existing peacefully. Taking up your full, deserved, rightful place in the world.", "Stay a little longer. There is no hurry here. Nowhere to be. Nothing to do. No one to be for.", "BREATH_IN:One last breath in... slow... peaceful... complete...", "BREATH_OUT:And out... long... quiet... releasing everything... becoming still...", "When you are ready to return, carry something back with you.", "Not a plan. Not a task. Just a feeling. The feeling of this moment. The knowledge that peace lives inside you — not somewhere in the future when things get easier, but right here, right now, in this body, in this breath, in this life exactly as it is.", "You gave yourself five minutes today.", "That is not nothing. That is everything."], "introCount": 8}], "c1": "#A8E6A1", "c2": "#5FA85C"},{"group": "Spiritual Healing", "icon": "🙏", "sessions": [{"title": "You Are Not Alone In This", "duration": "10 min", "introCount": 0, "paragraphs": ["A deep spiritual meditation reminding you that you are held, loved, and never truly alone on this journey.", "Close your eyes. Breathe slowly. function previewSeek(val) {
  // Update timer display while dragging, without moving audio
  var a = getAudioEl();
  if (!a.duration) return;
  var pos = (val/100) * a.duration;
  var m = Math.floor(pos/60), s = Math.floor(pos%60);
  var pt = document.getElementById('pTimer');
  if (pt) pt.textContent = m+':'+(s<10?'0':'')+s;
}
function seekTo(val) {
  var a = getAudioEl();
  if (a.duration && !isNaN(a.duration)) {
    a.currentTime = (val/100) * a.duration;
    previewSeek(val);
  }
}

function _runBreath() {
  if (!isPlaying || isPaused) return;

  var t = document.getElementById('circleText');
  if (!c) return;
  if (_breathPhase === 0) {
    c.className = 'breath-circle inhale';
    if (t) t.textContent = 'breathe in';
  } else if (_breathPhase === 1) {
    c.className = 'breath-circle';
    if (t) t.textContent = '♪';
  } else {
    c.className = 'breath-circle exhale';
    if (t) t.textContent = 'breathe out';
  }
  _breathPhase = (_breathPhase + 1) % 3;
}
function stopBreathCycle() {

function parseCue(p){
  var m = p.match(/^([A-Z_]+):\s*/);
  if(!m) return {kind:null, text:p};
  var label=m[1], rest=p.slice(m[0].length);
  if(label==='BREATH_IN') return {kind:'in', text:rest};
  if(label==='BREATH_PURSED_OUT') return {kind:'pursed', text:rest};
  if(label==='BREATH_BELLY_OUT'||label==='BREATH_OUT') return {kind:'belly', text:rest};
  return {kind:null, text:rest};
}
function splitAtCommas(text){
  var parts=text.split(/,\s*/), result=[], buffer='';
  parts.forEach(function(part){
    part=part.trim(); if(!part)return;
    if(buffer){
      if(buffer.split(/\s+/).length<3) buffer=buffer+' '+part;
      else { result.push(buffer); buffer=part; }
    } else buffer=part;
  });
  if(buffer)result.push(buffer);
  return result;
}

function togglePlay(){
  if(!isPlaying)startPlaying();
  else if(isPaused)resumePlaying();
  else pausePlaying();
}
function startPlaying(){
  var url=getAudioUrl(curG,curS);
  var a=getAudioEl();
  if(!url){
    var ct=document.getElementById('circleText');
    if(ct)ct.textContent='coming soon';
    alert('Audio for this session is coming soon.');
    return;
  }
  if(a.src!==url){a.src=url;a.currentTime=0;}
  a.play();
  isPlaying=true;isPaused=false;
  document.getElementById('playBtn').textContent='⏸';
  startBreathCycle();
  requestWL();
  progress.lastG=curG;progress.lastS=curS;store('phwm_progress',progress);
}
function pausePlaying(){
  getAudioEl().pause();
  isPaused=true;clearInterval(timerInterval);stopBreathCycle();releaseWL();
  document.getElementById('playBtn').textContent='▶';
  var c=document.getElementById('breathCircle');if(c)c.className='breath-circle';
  var t=document.getElementById('circleText');if(t)t.textContent='⏸';
}
function resumePlaying(){
  getAudioEl().play();
  isPaused=false;requestWL();startBreathCycle();
  document.getElementById('playBtn').textContent='⏸';
}
function stopSession(){
  var a=document.getElementById('sessAudio');
  if(a){a.pause();a.removeAttribute('src');a.load();}
  isPlaying=false;isPaused=false;elapsed=0;
  clearInterval(timerInterval);stopBreathCycle();releaseWL();
  var pb=document.getElementById('playBtn');if(pb)pb.textContent='▶';
  var pt=document.getElementById('pTimer');if(pt)pt.textContent='0:00';
  var bar=document.getElementById('seekBar');if(bar)bar.value=0;
  var dur=document.getElementById('audioDuration');if(dur)dur.textContent='';
  var c=document.getElementById('breathCircle');if(c)c.className='breath-circle';
  var t=document.getElementById('circleText');if(t)t.textContent='ready';
}
function finishSession(){
  markDone();stopSession();
  var t=document.getElementById('circleText');if(t)t.textContent='complete 🙏';
  var cb=document.getElementById('autoNextCheck');
  if(cb&&cb.checked){setTimeout(function(){if(!isPlaying)nextSessionAuto();},1500);}
}
function replaySession(){var a=getAudioEl();a.currentTime=0;a.play();isPlaying=true;isPaused=false;document.getElementById('playBtn').textContent='⏸';}
function skipForward(){var a=getAudioEl();if(a.readyState)a.currentTime=Math.min(a.duration||0,a.currentTime+10);}
function skipBack(){var a=getAudioEl();if(a.readyState)a.currentTime=Math.max(0,a.currentTime-10);}
function prevSession(){ if(curS>0){ stopSession(); openPlayer(curG,curS-1);} }
function nextSessionBtn(){ if(curS<GROUPS[curG].sessions.length-1){ stopSession(); openPlayer(curG,curS+1);} }
function nextSessionAuto(){
  if(curS<GROUPS[curG].sessions.length-1){ openPlayer(curG,curS+1); startPlaying(); }
}
function startTimer(){}  // driven by audio timeupdate
function requestWL(){
  try{ if('wakeLock' in navigator){ navigator.wakeLock.request('screen').then(function(wl){wakeLock=wl;}).catch(function(){}); } }catch(e){}
}
function releaseWL(){ try{ if(wakeLock){wakeLock.release();wakeLock=null;} }catch(e){} }
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&isPlaying&&!isPaused)requestWL();
});

function markDone(){
  var key=curG+'-'+curS;
  progress.done[key]=true;
  var mins=parseInt(GROUPS[curG].sessions[curS].duration)||12;
  progress.minutes+=mins;
  var today=new Date().toDateString();
  if(progress.lastDay!==today){
    var yest=new Date(); yest.setDate(yest.getDate()-1);
    progress.streak=(progress.lastDay===yest.toDateString())?progress.streak+1:1;
    progress.lastDay=today;
  }
  store('phwm_progress',progress);
  updateStats();
}
function updateStats(){
  var n=Object.keys(progress.done).length;
  ['statSessions','jSessions'].forEach(function(id){var e=document.getElementById(id);if(e)e.textContent=n;});
  ['statStreak','jStreak'].forEach(function(id){var e=document.getElementById(id);if(e)e.textContent=progress.streak;});
  ['statMinutes','jMinutes'].forEach(function(id){var e=document.getElementById(id);if(e)e.textContent=progress.minutes;});
  var jr=document.getElementById('jReviewed'); if(jr)jr.textContent=Object.keys(reviews).length;
}

// ── NAV / RENDER ──
function showView(id){
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
  document.getElementById('navHome').className='nav-btn'+(id==='viewHome'?' on':'');
  document.getElementById('navJourney').className='nav-btn'+(id==='viewJourney'?' on':'');
}
function navTo(id){
  if(id==='viewJourney')renderJourney();
  if(id==='viewHome')renderHome();
  showView(id);
}
function heroTap(){
  if(progress.lastG!==null&&GROUPS[progress.lastG]){ openPlayer(progress.lastG, progress.lastS||0); }
  else { openPlayer(0,0); }
}
function sosTap(){
  // Emergency calm: Breath Awareness session 1 until Group 16 is scripted
  openPlayer(2,0); startPlaying();
}
function openGroup(gi){
  curG=gi;
  var g=GROUPS[gi];
  document.getElementById('groupTitle').textContent='';
  var c1=g.c1||'#7B6FDE', c2=g.c2||'#4A3F8F';
  var header='<div style="margin:0 0 18px;padding:28px 22px 22px;background:linear-gradient(135deg,'+c1+'22,'+c2+'33);border-bottom:1px solid '+c1+'33;">'+
    '<div style="font-size:44px;margin-bottom:10px;">'+g.icon+'</div>'+
    '<div style="font-size:20px;font-weight:700;color:#F0EDFA;">'+g.group+'</div>'+
    '<div style="font-size:12px;color:#8B87A8;margin-top:4px;letter-spacing:1px;">'+g.sessions.length+' SESSIONS</div>'+
  '</div>';
  document.getElementById('sessionList').innerHTML=header+g.sessions.map(function(s,si){
    var key=gi+'-'+si;
    var done=progress.done[key];
    var faved=favs[key]?'faved':'';
    var doneIcon=done?'<span style="color:#7BC98E;font-size:13px;margin-right:4px;">✓</span>':'';
    return '<div class="sess-item" onclick="openPlayer('+gi+','+si+')" style="border-left:3px solid '+c1+'66;">'+
      '<div class="sess-num" style="background:'+c1+'22;border:1.5px solid '+c1+'55;color:#F0EDFA;font-size:12px;font-weight:700;">'+(si+1)+'</div>'+
      '<div class="sess-info">'+
        '<div class="sess-name">'+doneIcon+s.title+'</div>'+
        '<div class="sess-meta">'+s.duration+'</div>'+
      '</div>'+
      '<div style="display:flex;align-items:center;gap:8px;">'+
        '<button class="fav-btn '+faved+'" onclick="toggleFav(event,'+gi+','+si+')">♥</button>'+
        '<div style="font-size:18px;color:'+c1+';opacity:0.7;">›</div>'+
      '</div>'+
    '</div>';
  }).join('');
  showView('viewGroup');
}
function toggleFav(ev,gi,si){
  ev.stopPropagation();
  var key=gi+'-'+si;
  if(favs[key])delete favs[key]; else favs[key]=true;
  store('phwm_favs',favs);
  openGroup(gi);
}
function openPlayer(gi,si){
  stopSession();
  curG=gi; curS=si;
  var g=GROUPS[gi], s=g.sessions[si];
  document.getElementById('pGroup').textContent=g.icon+' '+g.group;
  document.getElementById('pTitle').textContent=s.title;
  renderScript(); loadRev();
  pTab('play');
  showView('viewPlayer');
}
function exitPlayer(){ stopSession(); openGroup(curG); }

// ── PLAYER TABS ──
function pTab(which){
  ['play','script','review'].forEach(function(t){
    document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).className='ptab'+(t===which?' on':'');
    document.getElementById('body'+t.charAt(0).toUpperCase()+t.slice(1)).className='ptab-body'+(t===which?' on':'');
  });
}
function renderScript(){
  var s=GROUPS[curG].sessions[curS];
  var htmlParts=[];
  s.paragraphs.forEach(function(p,pi){
    var isIntro=pi<s.introCount;
    var cue=parseCue(p);
    var cls='script-p'+(cue.kind?' cue':'')+(isIntro?' intro-p':'');
    var prefix=cue.kind==='in'?'🌬 IN — ':cue.kind==='belly'?'🌬 OUT — ':cue.kind==='pursed'?'🌬 PURSED OUT — ':'';
    htmlParts.push('<div class="'+cls+'">'+prefix+cue.text+'</div>');
    if(isIntro&&pi===s.introCount-1)htmlParts.push('<div class="intro-divider">— session begins —</div>');
  });
  document.getElementById('scriptBox').innerHTML=htmlParts.join('');
}

// ── REVIEW ──
function revKey(){ return curG+'-'+curS; }
function loadRev(){
  var r=reviews[revKey()]||{};
  document.getElementById('revNote').value=r.note||'';
  document.getElementById('revOk').className='rev-btn'+(r.status==='approved'?' ok-on':'');
  document.getElementById('revNeeds').className='rev-btn'+(r.status==='needs'?' needs-on':'');
  document.getElementById('revMsg').textContent='';
}
function setRev(status){
  var r=reviews[revKey()]||{};
  r.status=(r.status===status)?null:status;
  reviews[revKey()]=r; store('phwm_reviews',reviews);
  loadRev();
  document.getElementById('revMsg').textContent='Status saved';
}
function saveRev(){
  var r=reviews[revKey()]||{};
  r.note=document.getElementById('revNote').value;
  reviews[revKey()]=r; store('phwm_reviews',reviews);
  document.getElementById('revMsg').textContent='✓ Review saved';
  updateStats();
}
function exportAll(){
  var out='PH WARRIOR MIND — FULL APP FEEDBACK\n===================================\n\n';
  GROUPS.forEach(function(g,gi){
    var lines=[];
    g.sessions.forEach(function(s,si){
      var r=reviews[gi+'-'+si];
      if(r&&(r.status||r.note)){
        lines.push('  S'+(si+1)+' — '+s.title+'\n    Status: '+(r.status||'—')+'\n    Notes: '+(r.note||'—'));
      }
    });
    if(lines.length){ out+=g.group+'\n'+lines.join('\n')+'\n\n'; }
  });
  if(out.indexOf('S')<0) out+='(no feedback recorded yet)';
  var ov=document.getElementById('exportOverlay');
  document.getElementById('expArea').value=out;
  ov.className='show';
  try{ document.getElementById('expArea').select(); document.execCommand('copy'); }catch(e){}
}

// ── JOURNEY ──
function renderJourney(){
  updateStats();
  var list=[];
  GROUPS.forEach(function(g,gi){
    g.sessions.forEach(function(s,si){
      if(favs[gi+'-'+si]){
        list.push('<div class="sess-item" onclick="openPlayer('+gi+','+si+')">'+
          '<div class="sess-num" style="background:linear-gradient(135deg,'+g.c1+','+g.c2+');">'+g.icon+'</div>'+
          '<div class="sess-info"><div class="sess-name">'+s.title+'</div>'+
          '<div class="sess-meta">'+g.group+'</div></div></div>');
      }
    });
  });
  document.getElementById('favList').innerHTML=list.length?list.join(''):'<div class="fav-empty">Tap ♥ on any session to save it here</div>';
}

// ── HOME ──
function renderHome(){
  var h=new Date().getHours();
  var g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  document.getElementById('greeting').innerHTML=g+', <b>warrior</b>';
  var day=Math.floor(Date.now()/86400000);
  document.getElementById('dailyQuote').textContent='"'+QUOTES[day%QUOTES.length]+'"';
  var hg,hs,label;
  if(progress.lastG!==null&&GROUPS[progress.lastG]){
    hg=progress.lastG; hs=progress.lastS||0; label='Continue where you left off';
  } else {
    hg=day%GROUPS.length; hs=day%GROUPS[hg].sessions.length; label="Today's Session";
  }
  document.getElementById('heroLabel').textContent=label;
  document.getElementById('heroTitle').textContent=GROUPS[hg].sessions[hs].title;
  document.getElementById('heroSub').textContent=GROUPS[hg].icon+' '+GROUPS[hg].group+' · '+GROUPS[hg].sessions[hs].duration;
  document.getElementById('groupGrid').innerHTML=GROUPS.map(function(g,gi){
    return '<div class="tile" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.09);box-shadow:inset 0 0 40px '+g.c1+'18,0 4px 20px rgba(0,0,0,0.3);" onclick="openGroup('+gi+')">'+
      '<div class="tile-emoji">'+g.icon+'</div>'+
      '<div><div class="tile-name">'+g.group+'</div>'+
      '<div class="tile-count">'+g.sessions.length+' sessions</div></div></div>';
  }).join('');
  updateStats();
}

/* ── BACKGROUND MUSIC ── */
var musicCtx = null;
var musicNodes = { gain: null, osc1: null, osc2: null, osc3: null };
var musicOn = false;

function initMusic() {
  if (musicCtx) return;
  try {
    musicCtx = new (window.AudioContext || window.webkitAudioContext)();
    musicNodes.gain = musicCtx.createGain();
    musicNodes.gain.gain.value = 0;
    musicNodes.gain.connect(musicCtx.destination);
    // Ambient drone — three detuned sine waves
    [110, 110.3, 220.15].forEach(function(freq, i) {
      var osc = musicCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      var g = musicCtx.createGain();
      g.gain.value = i === 2 ? 0.06 : 0.12;
      osc.connect(g);
      g.connect(musicNodes.gain);
      osc.start();
    });
    // Soft high shimmer
    var osc4 = musicCtx.createOscillator();
    osc4.type = 'sine';
    osc4.frequency.value = 528;
    var g4 = musicCtx.createGain();
    g4.gain.value = 0.03;
    osc4.connect(g4);
    g4.connect(musicNodes.gain);
    osc4.start();
  } catch(e) {}
}

function toggleMusic() {
  initMusic();
  musicOn = !musicOn;
  var btn = document.getElementById('musicToggle');
  var vol = document.getElementById('musicVol');
  if (musicOn) {
    btn.classList.add('on');
    vol.classList.add('active');
    if (musicCtx && musicCtx.state === 'suspended') musicCtx.resume();
    if (musicNodes.gain) {
      musicNodes.gain.gain.cancelScheduledValues(musicCtx.currentTime);
      musicNodes.gain.gain.linearRampToValueAtTime(getMusicGain(), musicCtx.currentTime + 2);
    }
  } else {
    btn.classList.remove('on');
    vol.classList.remove('active');
    if (musicNodes.gain && musicCtx) {
      musicNodes.gain.gain.cancelScheduledValues(musicCtx.currentTime);
      musicNodes.gain.gain.linearRampToValueAtTime(0, musicCtx.currentTime + 1.5);
    }
  }
}

function getMusicGain() {
  var v = document.getElementById('musicVol');
  return v ? (parseFloat(v.value) / 100) * 0.4 : 0.12;
}

function setMusicVol(val) {
  if (musicNodes.gain && musicCtx && musicOn) {
    musicNodes.gain.gain.cancelScheduledValues(musicCtx.currentTime);
    musicNodes.gain.gain.linearRampToValueAtTime((val / 100) * 0.4, musicCtx.currentTime + 0.3);
  }
}

function stopMusic() {
  if (musicNodes.gain && musicCtx && musicOn) {
    musicNodes.gain.gain.cancelScheduledValues(musicCtx.currentTime);
    musicNodes.gain.gain.linearRampToValueAtTime(0, musicCtx.currentTime + 2);
  }
}
