<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PH Warrior Mind</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: -apple-system,'Segoe UI',Roboto,sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(123,111,222,0.28), transparent 60%),
      radial-gradient(900px 500px at -10% 30%, rgba(91,200,175,0.14), transparent 55%),
      radial-gradient(800px 600px at 50% 110%, rgba(245,168,201,0.12), transparent 60%),
      linear-gradient(180deg,#0A0E20 0%,#131530 55%,#1B1838 100%);
    background-attachment: fixed;
    color:#F0EDFA; min-height:100vh; overflow-x:hidden;
  }
  .view { display:none; min-height:100vh; padding-bottom:96px; }
  .view.active { display:block; animation:fadeIn .35s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:none;} }

  /* HOME */
  .home-top { display:flex; align-items:center; justify-content:space-between; padding:50px 22px 4px; }
  .greeting { font-size:24px; font-weight:300; }
  .greeting b { font-weight:700; background:linear-gradient(90deg,#F5C97B,#F9A8C9); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub-greet { font-size:12px; color:#8B87A8; margin-top:3px; letter-spacing:2px; text-transform:uppercase; }
  .orb {
    width:52px;height:52px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(245,201,123,.6), rgba(123,111,222,.35) 65%, transparent);
    border:1px solid rgba(245,201,123,.45);
    animation:breathe 9s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100%{transform:scale(1);opacity:.8;} 45%{transform:scale(1.15);opacity:1;} 60%{transform:scale(1.15);} }

  .hero {
    margin:20px 18px 0; border-radius:26px; padding:24px 22px; position:relative; overflow:hidden; cursor:pointer;
    background:linear-gradient(135deg, rgba(123,111,222,.55), rgba(74,63,143,.65));
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 14px 40px rgba(0,0,0,.35);
  }
  .hero::after { content:''; position:absolute; right:-40px; top:-40px; width:170px; height:170px; border-radius:50%;
    background:radial-gradient(circle, rgba(245,201,123,.35), transparent 70%); }
  .hero-label { font-size:10.5px; letter-spacing:2.5px; color:#F5C97B; text-transform:uppercase; font-weight:600; }
  .hero-title { margin-top:8px; font-size:21px; font-weight:700; line-height:1.35; max-width:250px; }
  .hero-sub { margin-top:6px; font-size:12.5px; color:#C9C3E6; }
  .hero-play { margin-top:16px; display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.22); border-radius:22px; padding:9px 18px; font-size:13px; font-weight:600; }

  .quote { margin:18px 28px 0; text-align:center; font-size:13.5px; line-height:1.7; color:#A9A2CB; font-style:italic; }

  .stats-row { display:flex; gap:11px; margin:18px 18px 2px; }
  .stat {
    flex:1; text-align:center; padding:14px 4px; border-radius:20px;
    background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.09);
    backdrop-filter:blur(8px);
  }
  .stat-n { font-size:22px; font-weight:800; background:linear-gradient(90deg,#F5C97B,#F9A8C9); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .stat-l { font-size:9.5px; color:#8B87A8; letter-spacing:1.5px; margin-top:3px; text-transform:uppercase; }

  .sec-title { margin:26px 22px 12px; font-size:12.5px; letter-spacing:2.5px; color:#8B87A8; text-transform:uppercase; font-weight:600; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:13px; margin:0 18px; }
  .tile {
    border-radius:24px; padding:18px 15px 15px; cursor:pointer; position:relative; overflow:hidden;
    border:1px solid rgba(255,255,255,.10); min-height:132px;
    display:flex; flex-direction:column; justify-content:flex-end;
    transition:transform .15s, box-shadow .15s;
    backdrop-filter:blur(12px);
  }
  .tile:hover { border-color:rgba(255,255,255,.18); }
  .tile:active { transform:scale(.97); }
  .tile-emoji { font-size:40px; position:absolute; top:14px; left:15px; filter:drop-shadow(0 4px 12px rgba(0,0,0,.5)); }
  .tile-name { font-size:13.5px; font-weight:700; line-height:1.3; color:#F0EDFA; letter-spacing:0.2px; }
  .tile-count { font-size:11px; color:rgba(255,255,255,.85); margin-top:3px; }

  /* SOS */
  .sos-fab {
    position:fixed; right:18px; bottom:96px; z-index:50;
    width:62px; height:62px; border-radius:50%; border:none; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #FF7B6B, #E5484D);
    color:#fff; font-weight:800; font-size:13.5px; letter-spacing:1px;
    box-shadow:0 8px 26px rgba(229,72,77,.5);
    animation:sosPulse 2.6s ease-in-out infinite;
  }
  @keyframes sosPulse { 0%,100%{box-shadow:0 8px 26px rgba(229,72,77,.45);} 50%{box-shadow:0 8px 38px rgba(229,72,77,.8);} }

  /* GROUP VIEW */
  .topbar { display:flex; align-items:center; gap:13px; padding:22px 18px 12px; }
  .back-btn { background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.1); color:#F0EDFA; width:40px;height:40px; border-radius:14px; font-size:18px; cursor:pointer; }
  .topbar-title { font-size:17px; font-weight:700; flex:1; line-height:1.3; }
  .sess-item {
    margin:0 16px 10px; padding:16px 16px; border-radius:18px; display:flex; align-items:center; gap:13px; cursor:pointer;
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
    transition:background .15s, transform .12s;
  }
  .sess-item:active { background:rgba(255,255,255,.10); transform:scale(0.99); }
  .sess-num { width:37px;height:37px;border-radius:13px; display:flex;align-items:center;justify-content:center; font-size:13.5px; font-weight:700; flex-shrink:0; color:#1A1430; }
  .sess-info { flex:1; }
  .sess-name { font-size:14.5px; font-weight:600; line-height:1.35; }
  .sess-meta { font-size:11.5px; color:#8B87A8; margin-top:3px; display:flex; gap:8px; align-items:center; }
  .badge { font-size:9.5px; padding:2px 7px; border-radius:8px; font-weight:700; letter-spacing:.5px; }
  .badge.ok { background:rgba(123,201,142,.16); color:#7BC98E; }
  .badge.needs { background:rgba(245,168,110,.16); color:#F5A86E; }
  .fav-btn { background:none;border:none;font-size:19px;cursor:pointer;opacity:.4;padding:5px; }
  .fav-btn.faved { opacity:1; }
  .done-tick { color:#7BC98E; font-size:13px; }

  /* PLAYER */
  #viewPlayer.active { display:flex; flex-direction:column; }
  .ptabs { display:flex; gap:8px; margin:4px 18px 0; }
  .ptab { flex:1; padding:10px; text-align:center; border-radius:14px; font-size:12.5px; font-weight:600; cursor:pointer;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); color:#8B87A8; }
  .ptab.on { background:rgba(245,201,123,.15); border-color:rgba(245,201,123,.4); color:#F5C97B; }
  .ptab-body { flex:1; display:none; }
  .ptab-body.on { display:flex; flex-direction:column; }

  .player-body { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px 26px 0; text-align:center; }
  .p-group { font-size:10.5px; letter-spacing:2.5px; color:#8B87A8; text-transform:uppercase; font-weight:600; }
  .p-title { margin-top:8px; font-size:20px; font-weight:700; line-height:1.4; max-width:320px; }
  .breath-circle {
    width:210px;height:210px; margin:24px auto 6px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(245,201,123,.25), rgba(123,111,222,.15) 60%, transparent 78%);
    border:1.5px solid rgba(245,201,123,.35);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    transition:transform 4s ease-in-out, box-shadow 4s ease-in-out;
    font-size:12px; color:#D8D2EE; letter-spacing:1.5px; text-transform:uppercase;
    box-shadow:0 0 50px rgba(123,111,222,.2), inset 0 0 30px rgba(245,201,123,.05);
  }
  .breath-circle.inhale {
    transform:scale(1.18);
    transition-duration:4s;
    box-shadow:0 0 80px rgba(245,201,123,.35), inset 0 0 40px rgba(245,201,123,.1);
    border-color:rgba(245,201,123,.6);
  }
  .breath-circle.exhale {
    transform:scale(.88);
    transition-duration:6s;
    box-shadow:0 0 30px rgba(123,111,222,.15);
  }
  .p-timer { font-size:14px; color:#8B87A8; margin-top:6px; font-variant-numeric:tabular-nums; }
  .skip-intro { display:none; }
  .pcontrols { padding:16px 20px 8px; display:flex; align-items:center; justify-content:center; gap:13px; }
  .pc-btn { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:#F0EDFA; border-radius:18px; padding:14px 18px; font-size:14px; cursor:pointer; display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:62px; }
  .pc-btn:active { background:rgba(255,255,255,.2); }
  .pc-play {
    width:74px;height:74px;border-radius:50%;font-size:27px;border:none;cursor:pointer;color:#1A1430;
    background:linear-gradient(135deg,#F5C97B,#F9A8C9);
    box-shadow:0 8px 30px rgba(245,201,123,.4);
  }
  .pbottom { padding:0 22px 18px; display:flex; align-items:center; justify-content:space-between; }
  .auto-next { display:flex; align-items:center; gap:7px; color:#8B87A8; font-size:12px; cursor:pointer; }
  .auto-next input { accent-color:#F5C97B; width:16px;height:16px; }
  .pb-sm { background:none;border:none;color:#8B87A8;font-size:12.5px;cursor:pointer;padding:6px; }

  /* SCRIPT TAB */
  .script-box { flex:1; overflow-y:auto; margin:14px 18px; padding:18px; border-radius:20px;
    background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.08); }
  .script-p { font-size:14px; line-height:1.75; color:#D5CFEA; margin-bottom:15px; }
  .script-p.cue { color:#7FD8C7; font-style:italic; }
  .script-p.intro-p { color:#B9A8E0; }
  .intro-divider { text-align:center; font-size:10px; letter-spacing:2px; color:#F5C97B; margin:8px 0 16px; text-transform:uppercase; }

  /* REVIEW TAB */
  .review-box { flex:1; margin:14px 18px; }
  .rev-status-row { display:flex; gap:9px; margin-bottom:14px; }
  .rev-btn { flex:1; padding:13px 6px; border-radius:15px; font-size:12.5px; font-weight:700; cursor:pointer;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:#8B87A8; }
  .rev-btn.ok-on { background:rgba(123,201,142,.18); border-color:#7BC98E; color:#7BC98E; }
  .rev-btn.needs-on { background:rgba(245,168,110,.18); border-color:#F5A86E; color:#F5A86E; }
  .rev-note { width:100%; min-height:130px; border-radius:16px; padding:14px; font-size:14px; line-height:1.6;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:#F0EDFA; resize:vertical; font-family:inherit; }
  .rev-save { margin-top:12px; width:100%; padding:14px; border-radius:16px; border:none; cursor:pointer;
    background:linear-gradient(135deg,#F5C97B,#F9A8C9); color:#1A1430; font-weight:800; font-size:14px; }
  .rev-export { margin-top:10px; width:100%; padding:13px; border-radius:16px; cursor:pointer;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); color:#D5CFEA; font-weight:600; font-size:13px; }
  .rev-saved-msg { text-align:center; color:#7BC98E; font-size:12px; margin-top:9px; min-height:16px; }

  /* JOURNEY */
  .j-wrap { padding:8px 18px; }
  .j-big { border-radius:24px; padding:22px; text-align:center; margin-bottom:14px;
    background:linear-gradient(135deg, rgba(245,201,123,.14), rgba(123,111,222,.16));
    border:1px solid rgba(245,201,123,.25); }
  .j-big-n { font-size:42px; font-weight:800; background:linear-gradient(90deg,#F5C97B,#F9A8C9); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .j-big-l { font-size:11px; letter-spacing:2px; color:#8B87A8; text-transform:uppercase; margin-top:2px; }
  .fav-empty { text-align:center; color:#8B87A8; font-size:13px; padding:26px 20px; }

  /* BOTTOM NAV */
  .nav {
    position:fixed; bottom:0; left:0; right:0; z-index:60;
    display:flex; justify-content:space-around; padding:10px 8px 20px;
    background:rgba(12,14,32,.82); backdrop-filter:blur(18px);
    border-top:1px solid rgba(255,255,255,.09);
  }
  .nav-btn { background:none; border:none; color:#6E6890; font-size:10.5px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; letter-spacing:.5px; padding:2px 10px; }
  .nav-btn .nico { font-size:21px; }
  .nav-btn.on { color:#F5C97B; }

  /* MUSIC & VOICE CONTROLS */
  .audio-controls {
    margin:0 18px 8px; padding:14px 16px; border-radius:18px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09);
  }
  .audio-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .audio-row:last-child { margin-bottom:0; }
  .audio-label { font-size:11.5px; color:#8B87A8; min-width:90px; }
  .music-toggle {
    width:42px; height:24px; border-radius:12px; border:none; cursor:pointer;
    background:rgba(255,255,255,.12); position:relative; transition:background .2s; flex-shrink:0;
  }
  .music-toggle.on { background:linear-gradient(90deg,#F5C97B,#F9A8C9); }
  .music-toggle::after {
    content:''; position:absolute; width:18px; height:18px; border-radius:50%;
    background:#fff; top:3px; left:3px; transition:left .2s;
  }
  .music-toggle.on::after { left:21px; }
  .music-vol {
    flex:1; height:4px; border-radius:2px; accent-color:#F5C97B;
    opacity:.5; transition:opacity .2s;
  }
  .music-vol.active { opacity:1; }
  .voice-select {
    flex:1; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12);
    color:#F0EDFA; border-radius:10px; padding:6px 10px; font-size:12px; font-family:inherit;
  }

  /* overlay export */
  #exportOverlay { display:none; position:fixed; inset:0; z-index:100; background:rgba(5,6,16,.9); padding:22px; }
  #exportOverlay.show { display:flex; flex-direction:column; }
  .exp-area { flex:1; width:100%; border-radius:16px; padding:14px; font-size:12px; line-height:1.5; font-family:monospace;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); color:#F0EDFA; }
  .exp-close { margin-top:12px; padding:14px; border-radius:14px; border:none; background:#F5C97B; color:#1A1430; font-weight:800; cursor:pointer; }
</style>
</head>
<body>

<!-- HOME -->
<div class="view active" id="viewHome">
  <div class="home-top">
    <div>
      <div class="greeting" id="greeting"></div>
      <div class="sub-greet">PH Warrior Mind</div>
    </div>
    <div class="orb"></div>
  </div>
  <div class="hero" id="heroCard" onclick="heroTap()">
    <div class="hero-label" id="heroLabel">Today's Session</div>
    <div class="hero-title" id="heroTitle"></div>
    <div class="hero-sub" id="heroSub"></div>
    <div class="hero-play">▶ &nbsp;Begin</div>
  </div>
  <div class="quote" id="dailyQuote"></div>
  <div class="stats-row">
    <div class="stat"><div class="stat-n" id="statSessions">0</div><div class="stat-l">Sessions</div></div>
    <div class="stat"><div class="stat-n" id="statStreak">0</div><div class="stat-l">Day streak</div></div>
    <div class="stat"><div class="stat-n" id="statMinutes">0</div><div class="stat-l">Minutes</div></div>
  </div>
  <div class="sec-title">Explore</div>
  <div class="grid" id="groupGrid"></div>
</div>

<!-- GROUP -->
<div class="view" id="viewGroup">
  <div class="topbar" style="padding-bottom:8px;">
    <button class="back-btn" onclick="showView('viewHome')">‹</button>
    <div class="topbar-title" id="groupTitle" style="font-size:13px;color:#8B87A8;"></div>
  </div>
  <div id="sessionList" style="margin-top:0;"></div>
</div>

<!-- PLAYER -->
<div class="view" id="viewPlayer">
  <div class="topbar">
    <button class="back-btn" onclick="exitPlayer()">‹</button>
    <div class="topbar-title" style="font-size:13px;color:#8B87A8;font-weight:600;">NOW PLAYING</div>
  </div>
  <div class="ptabs" style="display:none;">
    <div class="ptab on" id="tabPlay" onclick="pTab('play')">Player</div>
    <div class="ptab" id="tabScript" onclick="pTab('script')">Script</div>
    <div class="ptab" id="tabReview" onclick="pTab('review')">Review</div>
  </div>

  <div class="ptab-body on" id="bodyPlay">
    <div class="player-body">
      <div class="p-group" id="pGroup" style="font-size:11px;letter-spacing:2px;color:#8B87A8;text-transform:uppercase;"></div>
      <div class="p-title" id="pTitle"></div>
      <div class="breath-circle" id="breathCircle"><span id="circleText">ready</span></div>
      <div class="p-timer" id="pTimer">0:00</div>

    </div>
    <div class="pcontrols">
      <button class="pc-btn" onclick="skipBack()" title="Back 10s">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="4" x2="5" y2="20"/></svg>
        <div style="font-size:9px;margin-top:2px;">10s</div>
      </button>
      <button class="pc-play" id="playBtn" onclick="togglePlay()">▶</button>
      <button class="pc-btn" onclick="skipForward()" title="Forward 10s">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="4" x2="19" y2="20"/></svg>
        <div style="font-size:9px;margin-top:2px;">10s</div>
      </button>
    </div>
    <div class="audio-controls">
      <div class="audio-row">
        <span class="audio-label">🎵 Music</span>
        <button class="music-toggle" id="musicToggle" onclick="toggleMusic()"></button>
        <input type="range" class="music-vol" id="musicVol" min="0" max="100" value="30" oninput="setMusicVol(this.value)">
      </div>
      <div class="audio-row" style="flex-direction:column;align-items:flex-start;gap:8px;width:100%;">
        <div style="display:flex;align-items:center;justify-content:space-between;width:100%;">
          <span class="audio-label" style="font-size:11px;">⏱ Progress</span>
          <span id="audioDuration" style="font-size:11px;color:#8B87A8;"></span>
        </div>
        <input type="range" id="seekBar" min="0" max="100" value="0"
          style="width:100%;accent-color:#F5C97B;height:6px;border-radius:3px;cursor:pointer;background:rgba(255,255,255,.15);"
          ontouchstart="this._seeking=true"
          onmousedown="this._seeking=true"
          ontouchend="this._seeking=false;seekTo(this.value)"
          onmouseup="this._seeking=false;seekTo(this.value)"
          oninput="previewSeek(this.value)">
      </div>
    </div>
    <div class="pbottom">
      <button class="pb-sm" onclick="prevSession()">⏮ Previous</button>
      <label class="auto-next"><input type="checkbox" id="autoNextCheck" checked><span>Auto-next</span></label>
      <button class="pb-sm" onclick="nextSessionBtn()">Next ⏭</button>
    </div>
  </div>

  <div class="ptab-body" id="bodyScript">
    <div class="script-box" id="scriptBox"></div>
  </div>

  <div class="ptab-body" id="bodyReview">
    <div class="review-box">
      <div class="rev-status-row">
        <button class="rev-btn" id="revOk" onclick="setRev('approved')">✅ Approved</button>
        <button class="rev-btn" id="revNeeds" onclick="setRev('needs')">✏️ Needs changes</button>
      </div>
      <textarea class="rev-note" id="revNote" placeholder="Write your notes for this session — anything that felt wrong: voice, rhythm, words, pauses, breath timing..."></textarea>
      <button class="rev-save" onclick="saveRev()">Save Review</button>
      <button class="rev-export" onclick="exportAll()">📋 Export All Feedback</button>
      <div class="rev-saved-msg" id="revMsg"></div>
    </div>
  </div>
</div>

<!-- JOURNEY -->
<div class="view" id="viewJourney">
  <div class="topbar"><div class="topbar-title">My Journey</div></div>
  <div class="j-wrap">
    <div class="j-big"><div class="j-big-n" id="jSessions">0</div><div class="j-big-l">Sessions completed</div></div>
    <div class="stats-row" style="margin:0 0 18px;">
      <div class="stat"><div class="stat-n" id="jStreak">0</div><div class="stat-l">Day streak</div></div>
      <div class="stat"><div class="stat-n" id="jMinutes">0</div><div class="stat-l">Total minutes</div></div>
      <div class="stat"><div class="stat-n" id="jReviewed">0</div><div class="stat-l">Reviewed</div></div>
    </div>
    <div class="sec-title" style="margin:6px 4px 12px;">♥ Favourites</div>
    <div id="favList"></div>
  </div>
</div>

<script>
const GROUPS = [{"group": "Morning Affirmations", "icon": "🌅", "sessions": [{"title": "I Am More Than My Diagnosis", "duration": "12 minutes", "paragraphs": ["Before we begin, I want you to do one small thing, with me.", "Stop. Just for a moment, stop, wherever your mind has been.", "It does not matter where it was — in tomorrow's worries, in something unfinished, in a conversation that is still replaying. Whatever it was holding, it can wait. Just for these few minutes, it can wait.", "Now, look around you, slowly. Notice what you can see, without judging any of it. Notice what you can hear, near you, and far away. Feel the surface beneath you, solid, and steady, and real.", "You are here. And right now, in this moment, nothing else is required of you. Not one single thing.", "These next minutes belong entirely to you. Not to the illness, not to anyone who needs something from you. Only to you.", "Your mind will wander during this session. That is normal, and it is not failure. When it wanders, simply notice, and bring it back here. It will wander again — and again, you bring it back. Every single time, gently, and without any frustration.", "You are worth this time. Let us begin.", "Good morning.", "Before this day asks anything of you — before the first task, the first notification, the first demand — I want to offer you something.", "Just a few minutes. Just for you. Just to remember who you are before the world reminds you of what you have.", "Find a comfortable position. Sit if you can. Lie down if that is what your body needs this morning. Rest your hands open in your lap or by your sides. There is no wrong way to be here.", "Let your jaw soften. Let your shoulders drop. Take one slow look at the light coming into your space — however it looks this morning — and then gently close your eyes.", "BREATH_IN:Take a slow breath in through your nose... let it be completely easy... let the morning air fill you without any effort at all...", "BREATH_OUT:And breathe out slowly... through slightly parted lips... let the night go with that breath... let any tension from sleep leave your body with the exhale...", "Good morning, warrior. You made it to another day. And that is where we begin.", "Today I want to speak directly to something that every person living with a serious illness understands — the quiet, persistent, almost invisible danger of letting a diagnosis become an identity.", "It happens gradually, and it happens without any intention. First you are a person who has pulmonary hypertension. Then, slowly, almost without noticing, you begin to introduce yourself differently. You begin to think about yourself differently. Your calendar fills with medical appointments. Your conversations increasingly orbit around symptoms and treatments. The illness, which began as something you had, starts to feel like something you are.", "And the world around you helps this happen without meaning to. Doctors speak about your numbers as though the numbers are you. Forms ask you to list your conditions as though your conditions are your biography. People ask how you are feeling — meaning, specifically, how is the PH today — not how are you, the whole, complex, irreducible, interesting human being behind the diagnosis.", "This is understandable. Medical care requires this focus. But it is also incomplete. Profoundly incomplete.", "Because you are so much more than this diagnosis. You were someone before it arrived. You are someone alongside it right now. And you will be someone in every moment that follows, regardless of what the numbers say.", "BREATH_IN:Breathe in slowly... and as the air arrives, feel yourself — all of yourself — arriving fully in this moment...", "BREATH_OUT:And breathe out... releasing any weight that the word patient has placed on you... you are a person first... always a person first...", "Think for a moment about who you were before the diagnosis. Not to grieve that version of yourself — grief has its place, but this is not that moment. Think about them to remember them. Because they are still here.", "You were someone with a particular history. With relationships built over years and held with care. With a mind that has learned things, solved things, wondered about things, been moved by things. With a specific sense of humor, or a way of noticing beauty in ordinary moments that belongs only to you. With opinions about things that matter and opinions about things that do not matter at all. With values that have shaped every significant decision you have ever made.", "A diagnosis did not change any of that. It added something — something heavy, something demanding, something that requires constant management and attention. But it did not subtract the person who was already fully formed and present before it arrived.", "You are still that person. Fully and completely. Without exception.", "BREATH_IN:Breathe in again... a little deeper... feel your chest and belly expand with this breath...", "BREATH_OUT:And out... long and slow... feel yourself settle more completely into this morning and into yourself...", "Let me offer you some affirmations now. These are not motivational phrases to repeat without meaning. They are true statements — statements about who you actually are — that the noise and weight of illness can sometimes bury. I want you to say them silently alongside me, and I want you to let them land.", "I am a person first. My diagnosis is something I have, not something I am.", "My worth is not determined by my test results, my oxygen saturation, my six-minute walk distance, or any number that appears on any report.", "My identity is built from my relationships, my values, my history, my choices, my loves, and my way of moving through the world. None of those things belong to the illness.", "I contain multitudes. I am someone's child, perhaps someone's parent, someone's partner, someone's friend. I am a person with memories that make me laugh and memories that have shaped me. I am a person with preferences and opinions and dreams that have nothing to do with my lungs.", "My illness is real, and my life is also real. Both are true at the same time. And my life is larger.", "Today I choose to lead with who I am, not with what I have.", "BREATH_IN:Breathe in slowly... feel the truth of those words settle into your body... they are not wishes... they are facts...", "BREATH_OUT:And breathe out... let any doubt or resistance leave with the exhale... you are allowed to believe good things about yourself... you are allowed to know your own worth...", "There will be days when the diagnosis feels like everything. When appointments and medications and symptoms take up so much space that there seems to be nothing left over for the rest of you. When you feel reduced to a set of numbers and a treatment protocol.", "On those days, I want you to come back to this morning. Come back to this breath. Come back to the knowledge that you existed before this illness arrived, that you exist alongside it now, and that you are immeasurably more than it will ever be.", "You are a warrior, yes. But more than that — you are a human being. Complete and whole and valuable. Not because of what you can endure or overcome or manage. But simply because you are here, and because who you are matters.", "BREATH_IN:One final morning breath in... let it be a breath of arrival... of beginning... of quiet readiness for the day ahead...", "BREATH_OUT:And breathe out slowly and completely... open your eyes when you are ready...", "Gently now — this session is complete. Carry this truth with you today: You are more than your diagnosis. You always were. You always will be. Good morning, warrior."], "introCount": 8}, {"title": "My Body Is Doing Its Best", "duration": "12 minutes", "paragraphs": ["Before we begin, I want you to do one small thing, with me.", "Stop. Just for a moment, stop, wherever your mind has been.", "It does not matter where it was — in tomorrow's worries, in something unfinished, in a conversation that is still replaying. Whatever it was holding, it can wait. Just for these few minutes, it can wait.", "Now, look around you, slowly. Notice what you can see, without judging any of it. Notice what you can hear, near you, and far away. Feel the surface beneath you, solid, and steady, and real.", "You are here. And right now, in this moment, nothing else is required of you. Not one single thing.", "These next minutes belong entirely to you. Not to the illness, not to anyone who needs something from you. Only to you.", "Your mind will wander during this session. That is normal, and it is not failure. When it wanders, simply notice, and bring it back here. It will wander again — and again, you bring it back. Every single time, gently, and without any frustration.", "You are worth this time. Let us begin.", "Good morning.", "Let us begin today with something that is both simple and profound. Something that, if you can truly receive it this morning, has the power to change the quality of your entire day.", "Your body is doing its best.", "Not a perfect body. Not an easy body to live in. Not a body that always cooperates with what you ask of it. But a body that is working — right now, in this very moment — as hard as it possibly can with everything it has been given to work with.", "Take a moment to settle in before we go further. Let your weight drop fully onto whatever surface is beneath you. Let your shoulders come down from wherever the night left them. Let your face relax — your forehead, the space between your brows, your jaw, the muscles around your eyes.", "There is nothing to do right now except be here and receive what this morning has for you.", "BREATH_IN:Take a gentle breath in... feel the air enter your body... feel your chest respond to the arrival of that breath... feel the whole quiet machinery of breathing doing what it does...", "BREATH_OUT:And breathe out slowly and completely... feel something release in your body as the air leaves... gratitude, if you can find it, for that simple and continuous miracle...", "Here is something worth holding in your mind this morning. The human heart beats approximately one hundred thousand times every single day. One hundred thousand. Without being asked. Without being thanked. Without requiring any conscious instruction from the mind that lives above it.", "Your heart has been doing this since before you were born. It has kept its rhythm through every difficult season. Through every night of disrupted sleep and every morning that arrived too soon. Through every frightening test result and every moment of uncertainty about the future. Through every time you pushed yourself and every time the illness pushed back.", "One hundred thousand beats a day, every day, with extraordinary faithfulness.", "And your breathing — which carries its own particular challenges that most people will never need to understand — is doing the same. With every breath you take, something remarkable happens. Air moves. Pressure changes. Oxygen crosses membranes. Blood is refreshed. The whole system cooperates to keep you here, to keep you functioning, to keep you alive and present in this morning.", "The pathways are narrower than they were designed to be. The pressures are higher than they should be. The work is harder than it needs to be. And still — without complaint, without stopping, without asking for recognition — the work continues.", "BREATH_IN:Breathe in slowly... and as you do, offer this breath genuine appreciation... not performed gratitude, but the real kind... the kind that comes from actually noticing what is happening...", "BREATH_OUT:And breathe out... and appreciate this too... the release, the letting go, the completion of the breath... your body managing the full cycle without your help...", "I want to invite you into a different relationship with your body this morning. Not the relationship of constant frustration — though frustration is completely understandable and completely valid. Not the relationship of anxious monitoring — though vigilance is simply part of living with PH responsibly.", "But a third relationship. The relationship of partnership. Of compassion offered to a body that is carrying an extraordinary load and getting up with you every single morning regardless.", "Think about what your body helped you do yesterday. Perhaps something significant — a hospital visit, a demanding meeting, a difficult conversation, a day that required more energy than you actually had available. Or perhaps something that sounds small but was not — getting dressed, preparing something to eat, making a phone call, sitting with someone you love.", "Whatever it was, your body carried you through it. Not effortlessly. Not without cost. But it showed up. It did the work. It did not quit.", "That deserves acknowledgment.", "BREATH_IN:Breathe in again... deeper this time... feel the effort and the gift of this breath arriving simultaneously...", "BREATH_OUT:And breathe out... and say to your body — silently, in whatever words feel true — whatever acknowledgment it has been waiting to hear from you...", "Let me offer you some affirmations to carry into this morning.", "My body is not my adversary. It is my home — the only one I will ever have — and I will tend it with kindness.", "My body is managing something genuinely difficult every single day, and it has not stopped. I will not stop either.", "I will not speak unkindly about this body today — not to other people, and not inside my own mind.", "When my body asks for rest, I will try to listen rather than override the signal.", "When my body offers me a good moment — a morning of easier breathing, a walk that felt possible, an hour of genuine energy — I will notice it and receive it with gratitude.", "My body and I are partners. We are on the same side. We are doing this together.", "BREATH_IN:Take a slow, intentional breath in... a breath of partnership... breathing with the body that carries you...", "BREATH_OUT:And breathe out... releasing any resentment or frustration you may be holding... your body does not deserve that weight... it is working as hard as it can...", "Living with pulmonary hypertension means inhabiting a body that requires more from you than most bodies require of their owners. More attention, more management, more patience, more daily grace.", "But it also means living in a body that demonstrates remarkable, quiet, unacknowledged resilience — every single morning — simply because it is determined to continue.", "Meet that determination today. Not with force or performance. But with the same quiet, steady, faithful commitment that your body extends to you without being asked.", "BREATH_IN:One last morning breath in... receive it as the gift it genuinely is...", "BREATH_OUT:And breathe it slowly out... and offer the gesture back... a moment of recognition between you and the extraordinary body that is carrying you through this life...", "Gently now — this session is drawing to a close. Your body is doing its best. And so are you. That is enough. That has always been enough. Good morning, warrior."], "introCount": 8}, {"title": "Today I Choose Courage", "duration": "12 minutes", "paragraphs": ["Before we begin, I want you to do one small thing, with me.", "Stop. Just for a moment, stop, wherever your mind has been.", "It does not matter where it was — in tomorrow's worries, in something unfinished, in a conversation that is still replaying. Whatever it was holding, it can wait. Just for these few minutes, it can wait.", "Now, look around you, slowly. Notice what you can see, without judging any of it. Notice what you can hear, near you, and far away. Feel the surface beneath you, solid, and steady, and real.", "You are here. And right now, in this moment, nothing else is required of you. Not one single thing.", "These next minutes belong entirely to you. Not to the illness, not to anyone who needs something from you. Only to you.", "Your mind will wander during this session. That is normal, and it is not failure. When it wanders, simply notice, and bring it back here. It will wander again — and again, you bring it back. Every single time, gently, and without any frustration.", "You are worth this time. Let us begin.", "Good morning.", "I want to talk to you about courage today. But not the version of courage that most people picture when they hear that word.", "Not the courage of the person who feels no fear and charges forward with overwhelming force. Not the cinematic courage of dramatic moments witnessed by crowds.", "I want to talk about the other kind. The quieter kind. The kind that happens in private, without witnesses, without recognition, without anyone around to name it correctly.", "The courage of getting out of bed on a morning when your body is already tired before the day has started.", "The courage of going to work — or to a meeting, or to a school event, or simply to the kitchen to make breakfast — when everything physical about you is asking for a different answer.", "The courage of sitting in a waiting room for the fourteenth time and still holding yourself together.", "The courage of choosing, again and again, to participate in a life that does not pause or accommodate itself to what you are carrying.", "That kind. Your kind.", "Settle into your body now. Take a moment to fully arrive in this morning. Feel the temperature of the air. Feel the weight of your own stillness. Feel the quiet that exists before the day's demands begin.", "BREATH_IN:Take a slow breath in through your nose... let it be the breath of arrival... you are here... you are awake... this morning has come to meet you...", "BREATH_OUT:And breathe out... release the night... release any anxiety that woke alongside you this morning... let it leave gently with the breath...", "Here is the truth about courage that does not get spoken enough, clearly enough, or often enough.", "Courage is not the absence of fear. Courage is the decision to act in spite of fear. Fear is not the opposite of courage — fear is the condition that makes courage possible in the first place.", "For someone living with pulmonary hypertension, fear is not an occasional visitor. It is a constant and familiar companion. The fear of a test result that has gotten worse. The fear of breathlessness arriving in a public place with no easy exit. The fear of being seen as diminished, as less capable, as someone to be handled carefully rather than engaged with fully. The fear of what the future holds and whether the future holds what you hoped it would.", "These fears are not weakness. They are not evidence of a problem with your character or your resilience. They are the completely rational, completely understandable response of a thoughtful person to a genuinely difficult situation. Any person living with what you are living with would feel exactly what you feel.", "But here is what makes you a warrior. You feel the fear — all of it, clearly and honestly — and you choose to move forward anyway.", "One step. One breath. One conversation. One appointment. One ordinary morning.", "That is what courage looks like from the inside. And from the outside, it looks like one of the bravest ways a human being can live.", "BREATH_IN:Breathe in slowly... and as you breathe, feel something settle beneath the fear... a quiet steadiness that has always been there, beneath everything...", "BREATH_OUT:And breathe out... let the fear be acknowledged rather than fought... let it know you see it clearly... and let it know it does not get to make the decisions today... you do...", "Think about a moment recently when you were afraid and you did it anyway. It does not need to be dramatic. Perhaps it was simply arriving at a hospital appointment when every part of you wanted to cancel and stay home. Perhaps it was speaking in a meeting when you were uncertain whether your breath would carry your words reliably. Perhaps it was telling someone honestly about how hard things have been, when the easier choice would have been to say you are fine.", "Whatever that moment was — it was courage. Real, earned, genuinely hard courage. Not performed for an audience. Not acknowledged by the people around you who saw only the ordinary surface of it. But real.", "You have been doing this kind of thing every single day.", "BREATH_IN:Breathe in again... breathe in the true and accurate recognition of your own courage... not as flattery... as fact...", "BREATH_OUT:And breathe out... let any dismissiveness about your own strength leave with this breath... you are allowed to know what you are...", "Let us speak some affirmations into this morning.", "Today I choose courage over avoidance.", "Today I choose to show up — for my own life, for the people who matter to me — even on days when showing up requires everything I have.", "I do not need to feel brave in order to act bravely. Courage is a choice, not a feeling. The feeling may or may not arrive. The choice is always available.", "Every time I face something difficult and move forward anyway, I am adding to a history of courage that belongs entirely to me and that no illness can diminish.", "I am not defined by my fears. I am defined by what I choose to do when fear is present.", "Today I choose to live — not merely to survive, not merely to manage — but to actually live as fully as this day will allow.", "BREATH_IN:Take a steady, grounded breath in... the breath of a person who has made a decision... who has chosen today...", "BREATH_OUT:And breathe out... feel yourself ready... not fearless... but ready... which is the only thing courage actually requires...", "The day ahead will ask things of you. Some of them will be ordinary. Some will require more than you feel you have. A few of them may feel genuinely hard.", "You have met days like that before. Every single one of them. And you are still here.", "BREATH_IN:One final breath in this morning... let it be intentional... let it be yours...", "BREATH_OUT:And breathe out slowly... and when you open your eyes, step forward into the day you are choosing...", "Gently now — this session is complete. Today you choose courage. And courage, today, is more than enough. Good morning, warrior."], "introCount": 8}, {"title": "I Am A Warrior Not A Patient", "duration": "12 minutes", "paragraphs": ["Before we begin, I want you to do one small thing, with me.", "Stop. Just for a moment, stop, wherever your mind has been.", "It does not matter where it was — in tomorrow's worries, in something unfinished, in a conversation that is still replaying. Whatever it was holding, it can wait. Just for these few minutes, it can wait.", "Now, look around you, slowly. Notice what you can see, without judging any of it. Notice what you can hear, near you, and far away. Feel the surface beneath you, solid, and steady, and real.", "You are here. And right now, in this moment, nothing else is required of you. Not one single thing.", "These next minutes belong entirely to you. Not to the illness, not to anyone who needs something from you. Only to you.", "Your mind will wander during this session. That is normal, and it is not failure. When it wanders, simply notice, and bring it back here. It will wander again — and again, you bring it back. Every single time, gently, and without any frustration.", "You are worth this time. Let us begin.", "Good morning.", "The word patient is worth thinking about for a moment.", "In one sense it describes someone receiving medical care — someone engaged with a healthcare system, managed by professionals, attending appointments and following protocols. In another older sense, the word means someone who waits. Someone who endures. Someone who is acted upon by larger forces rather than acting themselves.", "And somewhere between those two meanings, a quiet and limiting story can begin to form. A story in which you are primarily the person to whom things happen. The person who waits for results. The person who is assessed and monitored and adjusted. The person whose days are organized around what the illness requires rather than what the life wants.", "That story is not entirely wrong. Those things are real and they are genuinely part of living with pulmonary hypertension.", "But it is profoundly incomplete.", "Because alongside all of that — woven through all of that, running deeper than all of that — you are someone who acts. Who decides. Who adapts. Who fights, not always loudly or visibly, but continuously, with discipline and intelligence and a kind of quiet tenacity that most people around you will simply never see clearly enough.", "You are a warrior. And this morning I want you to fully remember that.", "Settle into your body now. Let the surface beneath you hold your weight completely. Let your breathing slow to whatever pace feels natural and unforced.", "BREATH_IN:Take a long, slow breath in through your nose... feel your warrior body receiving what it needs... steady and deep...", "BREATH_OUT:And breathe out through slightly parted lips... slowly... feel yourself arriving more fully in this morning with every breath...", "What does a real warrior look like? Not the version from films — not the person who is untouched by pain, who defeats every obstacle with ease, who never doubts or struggles or needs to stop.", "That is not a warrior. That is a fantasy.", "A real warrior is someone who knows their terrain completely. Who understands their challenge — not with fear, but with clear-eyed, well-earned knowledge. Who has built strategies through experience and adapted them when the first strategies stopped working. Who has learned, over time, to distinguish between what can be pushed through and what genuinely requires stopping and resting and beginning again.", "A real warrior falls down. Gets up. Falls down differently the next time. Gets up again. And eventually the getting up becomes simply what they do — not because it is easy, but because they have decided it is who they are.", "That description belongs to you. Exactly and completely.", "You know your own body in ways that no doctor can fully match, because they see you for an hour and you live there continuously. You have learned to read signals that most people do not even know exist. You have developed an internal understanding of how to live in this particular body that took years of difficult, costly, daily experience to build.", "That is not passivity. That is mastery. That is a warrior.", "BREATH_IN:Breathe in slowly... and feel — not as performance, but as simple factual recognition — the warrior that you actually are...", "BREATH_OUT:And breathe out... releasing any diminished version of yourself that illness or exhaustion has suggested... the truth is that you are formidable...", "Warriors also rest. This is perhaps the most important and most overlooked aspect of the warrior identity — and one that is especially important for you to hear.", "A warrior who refuses to rest eventually cannot continue. Rest is not retreat. Rest is not weakness. Rest is strategy. Rest is how a warrior maintains themselves across what is not a single battle but a long campaign.", "You are in a long campaign. There is no single decisive victory coming that ends everything and returns life to what it was before. There is only the daily practice — the daily discipline — of living fully, protecting your energy wisely, showing up for what genuinely matters, and resting deeply when your body requires it.", "That requires more intelligence and more sustained commitment than most people around you will ever be asked to demonstrate.", "BREATH_IN:Breathe in again... feel the steadiness at your center... the part of you that has not broken despite everything that has tried to break it...", "BREATH_OUT:And breathe out... let any accumulated weariness of spirit leave with this breath... it is allowed to go... it does not need to stay...", "Let us speak your warrior truth into this morning.", "I am not defined by what the illness prevents. I am defined by what I choose to do with what I have.", "I am not waiting for my life to properly begin once everything is under control. My life is happening right now, and I am choosing to live it.", "I have faced things that would genuinely stop most people. I am still here. That is not accident or luck. That is strength of character.", "I choose how I relate to this condition. The condition does not get to choose how I relate to it.", "I am a warrior. Warriors rest. Warriors adapt. Warriors feel fear and uncertainty and grief. And warriors continue anyway.", "Today I will meet whatever comes — large or small, easy or hard — with the quiet, sustained, intelligent courage that has always been my greatest asset.", "BREATH_IN:Take a warrior breath in this morning... steady and purposeful... the breath of someone who knows exactly what they are made of...", "BREATH_OUT:And breathe out slowly and completely... the breath of someone who is ready for this day...", "You are not a patient this morning. You are a person with extraordinary strength who also happens to be receiving medical care. Those are not the same thing. They have never been the same thing.", "BREATH_IN:One last breath in... let it be intentional and true...", "BREATH_OUT:And breathe out... open your eyes... and go be exactly who you are...", "Gently now — this session is complete. Good morning, warrior. This day is yours."], "introCount": 8}, {"title": "This Breath, This Moment, This Life", "duration": "12 minutes", "paragraphs": ["Before we begin, I want you to do one small thing, with me.", "Stop. Just for a moment, stop, wherever your mind has been.", "It does not matter where it was — in tomorrow's worries, in something unfinished, in a conversation that is still replaying. Whatever it was holding, it can wait. Just for these few minutes, it can wait.", "Now, look around you, slowly. Notice what you can see, without judging any of it. Notice what you can hear, near you, and far away. Feel the surface beneath you, solid, and steady, and real.", "You are here. And right now, in this moment, nothing else is required of you. Not one single thing.", "These next minutes belong entirely to you. Not to the illness, not to anyone who needs something from you. Only to you.", "Your mind will wander during this session. That is normal, and it is not failure. When it wanders, simply notice, and bring it back here. It will wander again — and again, you bring it back. Every single time, gently, and without any frustration.", "You are worth this time. Let us begin.", "Good morning.", "Of all the ways that living with pulmonary hypertension changes a life, perhaps the most invisible and the most persistent is this — it can steal your ability to simply be present.", "When every breath is something you are aware of — when breathing, which most people never consciously think about at all, becomes something you monitor and assess and sometimes worry about — it becomes very difficult to simply be here. In this moment. Without the past pulling at you and the future pressing in on you from the other side.", "Living with a serious illness can mean living in a state of permanent anticipation. Waiting for the next symptom to arrive. Waiting for the next appointment to confirm or deny your fears. Waiting to find out whether the treatment is working, whether the numbers have shifted, whether things are moving in the right direction or the wrong one.", "And beneath all of that waiting, without quite realizing it, you begin to wait for the present moment to simply be over — so you can get to some calmer, safer, more settled future that may or may not come in the form you are hoping for.", "This morning I want to offer you something different. I want to offer you this moment. Just this one. Not the next one. Not the better one you are waiting for. This one, exactly as it is, complete in itself, and sufficient in itself.", "Settle in. Let your body find its stillness. Let your breathing slow to whatever feels natural and unforced.", "BREATH_IN:Take a slow breath in... and as you do, notice this specific breath... not breath in general, not breathing as a concept... this exact breath... the one that is happening right now in your body...", "BREATH_OUT:And breathe out slowly... and notice this exhale too... the feel of the release... the quiet relief of it... the sense of completion as the breath finishes its cycle...", "You just did something that sounds simple but is actually quite rare. You were fully present for a breath. You inhabited it. You noticed it. You were there for it from beginning to end.", "For someone living with a complicated relationship with breathing, choosing to be fully present for a breath — rather than anxious about it — is a genuine and meaningful act. It is a reclamation of something the illness would prefer to take.", "Notice that the breath that just happened is gone now. It exists only in the past. The next breath has not yet happened. It exists only in the future.", "And right now, in this small gap between the last breath and the next — there is only this moment. This stillness. This morning light. This version of you, alive and here and present.", "BREATH_IN:Breathe in again... and this time bring your complete attention with the breath as it arrives... feel the temperature of the air... feel the gentle expansion in your chest and your belly... feel your body receiving this gift without any help from your conscious mind...", "BREATH_OUT:And breathe out... and follow the breath all the way to the end... to the quiet, brief, perfect moment of stillness at the very bottom of the exhale where everything pauses...", "There is a truth that has been spoken by wise people across many centuries and many traditions, and it is this: the present moment is the only place where life actually occurs.", "The past is memory — real and important, but no longer happening.", "The future is imagination — real and worth considering, but not yet here.", "Only now is actually unfolding. Only now is where experience is actually taking place. And only now is where you have any real power to choose how you meet your life.", "For someone living with a serious illness, this truth can feel both deeply comforting and deeply challenging — sometimes both in the same breath. Because the present moment sometimes contains difficulty. Sometimes contains limitation. Sometimes contains pain or fear or the particular exhaustion that comes from managing something that does not rest.", "But the present moment also contains everything that is genuinely beautiful about your life right now. The quality of the light this morning. The warmth of a surface beneath your body. The knowledge that someone who loves you exists somewhere in the world. The small, persistent, extraordinary miracle of being alive and aware in this moment.", "BREATH_IN:Breathe in slowly... and let this breath be a full return to the present... let it carry you all the way back here... to this room, this morning, this body, this life...", "BREATH_OUT:And breathe out... releasing the pull of the past and the anxiety of the future... releasing everything except this moment... just here... just now... just this...", "Let us speak some affirmations for this morning — about presence, about this moment, about this life as it actually is.", "This moment is enough. I do not need it to be different in order to find something of value in it.", "This breath that I just took was a gift freely given. I received it.", "My life is not suspended, waiting to begin when circumstances improve. My life is happening right now, in this breath, and I am choosing to be fully present for it.", "Every present moment contains something worth noticing. I will look today for what this particular day is offering me.", "I am here. Fully here. Not somewhere in last week's appointment or next month's scan. Here. In this morning. In this breath.", "This is my life. This breath, this moment, this day. And I choose — actively and intentionally — to be present for all of it.", "BREATH_IN:Take a long, full morning breath in... all the way in... this is your breath... this is your morning... this is your one beautiful and irreplaceable life...", "BREATH_OUT:And breathe out completely... and feel yourself settle into the present moment... not bracing for what comes next... simply here...", "Whatever this day brings, it will arrive one moment at a time. And in each of those moments, you will have the same choice you have right now — to be fully present, or to be somewhere else in your mind.", "Choose presence. Not because everything is easy. But because this is your life, and it is happening right now, and it deserves to be lived rather than waited through.", "BREATH_IN:One final breath to begin your day... receive it fully and completely...", "BREATH_OUT:And breathe it out slowly... open your eyes gently when you are ready... and step into this moment...", "Gently now — this session is complete. This breath. This moment. This life. All of it yours. Good morning, warrior."], "introCount": 8}], "c1": "#FFB347", "c2": "#FF8C69"}, {"group": "Night Gratitude", "icon": "🌙", "sessions": [{"title": "Three Things My Body Did Today", "duration": "12 minutes", "paragraphs": ["Before we begin, I want you to do one small thing, with me.", "Stop. Just for a moment, stop, wherever your mind has been.", "It does not matter where it was — in tomorrow's worries, in something unfinished, in a conversation that is still replaying. Whatever it was holding, it can wait. Just for these few minutes, it can wait.", "Now, look around you, slowly. Notice what you can see, without judging any of it. Notice what you can hear, near you, and far away. Feel the surface beneath you, solid, and steady, and real.", "You are here. And right now, in this moment, nothing else is required of you. Not one single thing.", "These next minutes belong entirely to you. Not to the illness, not to anyone who needs something from you. Only to you.", "Your mind will wander during this session. That is normal, and it is not failure. When it wanders, simply notice, and bring it back here. It will wander again — and again, you bring it back. Every single time, gently, and without any frustration.", "You are worth this time. Let us begin.", "Good evening.", "The day is done. Whatever it held — the easy parts and the difficult parts, the moments you managed well and the moments you simply got through — it is behind you now.", "This time belongs to you. Not to the illness. Not to tomorrow's plans. Not to anything unresolved. Just to you, in this quiet, in this stillness, in this moment of coming home to yourself.", "Find your position for the night. Let your body settle fully into the bed or the chair — wherever you are resting. Feel the weight of the entire day leaving your muscles as you give yourself permission to let go.", "Let your eyes close gently. Let your breathing slow. Let the sounds of the world outside remain outside, where they belong.", "BREATH_IN:Take a slow breath in through your nose... feel the night air arrive... cool and still and quiet...", "BREATH_OUT:And breathe out slowly... all the way out... let the day leave with that breath... completely and without holding on...", "This is not an exercise in forced positivity. I am not asking you to pretend that today was easy, or that the body cooperating feels the same as the body thriving. I am asking for something more honest than that.", "I am asking you to notice what actually happened — the real, specific, ordinary miraculous things — and to let them count. Because they do count. They count more than the difficult things, even when the difficult things are louder.", "The morning you woke into was given to you by a body that never stopped working through the night. The day you navigated was supported by a cardiovascular and pulmonary system that, despite everything it carries, showed up. And this evening — this quiet, deliberate choice to close the day with intention — that is also your body, still working, still here, still offering you what it has.", "Three things. Each of them real. Each of them yours. Each of them, if you let yourself receive them, a reason for something that functions like gratitude — not performed, not obligatory, but genuine. The kind that lands quietly in the chest and stays there.", "Tonight I want to do something simple with you. I want to find three things your body did for you today.", "Not achievements. Not performances. Not things that appear on any measure of success. Just three quiet, faithful things your body did — because it always does, without being asked, without being thanked, without ever stopping.", "Think about this morning first. The moment you opened your eyes. While you were sleeping, your body was working — breathing, circulating blood, maintaining pressure, keeping every system running — and it brought you through the night and into morning. You woke up.", "That sounds ordinary. It is not ordinary. For someone whose cardiopulmonary system works under the conditions yours works under, waking up is the result of sustained, continuous, faithful biological effort through every hour of the night. Your heart maintained its rhythm. Your lungs kept moving air. The whole complex, coordinated system kept its promises to you while you were unconscious and unaware.", "Your body did that. Quietly. For you. Without asking for anything in return.", "BREATH_IN:Breathe in slowly... and let this breath be a genuine acknowledgment of what your body did through the night...", "BREATH_OUT:And breathe out gently... and if you can find it, offer your body a simple, silent thank you... for the morning...", "Now think about something your body did during the day itself. It does not need to be something large or impressive. Perhaps it carried you to a place you needed to go — to work, to an appointment, to a kitchen, to a person who needed you. Perhaps it sat upright through something that required your presence. Perhaps it digested food, moved your hands, formed words, held a cup of tea.", "Think about how many individual actions your body coordinated today without your conscious involvement. Every step you took required balance, muscle coordination, cardiovascular response. Every word you spoke required breath control, muscle movement, neural coordination. Every time you reached for something, lifted something, turned your head to look at something — all of that was your body working on your behalf.", "And behind all of it, continuously, the heart maintained its rhythm and the lungs kept moving air under conditions that make all of it harder than it looks.", "That is the second thing. Everything your body helped you do today. All of it.", "BREATH_IN:Breathe in again... slowly and completely... for everything your body helped you do today...", "BREATH_OUT:And breathe out... thank you... for the day...", "And now this evening. The fact that you are here — that you found this time, that you are choosing to close the day with intention and rest — that required something from your body as well. The ability to be still. The ability to breathe calmly. The ability to receive quiet rather than needing to fill it. The willingness to allow the day to end.", "Your body is giving you all of that right now. In this moment. As you rest here and listen.", "That is the third thing.", "BREATH_IN:Breathe in slowly... feel the gift of this evening breath arriving...", "BREATH_OUT:And breathe out... thank you... for this evening... for this rest... for this quiet...", "Three things. Morning, day, evening. Your body was present for every moment of all of them.", "Living with pulmonary hypertension means that none of these things are as simple as they appear from the outside. Every breath involves a system working under elevated pressure. Every step involves a heart compensating. Every hour of being functional and present is the result of extraordinary, continuous, mostly invisible effort.", "Your body is not failing you. Your body is working for you. Faithfully and continuously. With everything it has.", "Let that settle tonight. Not as a thought to turn over and analyze. Just as something quiet and true to receive before sleep.", "BREATH_IN:One last slow breath in... feel your body breathing you... supporting you... keeping its promises to you through the night ahead...", "Living well with pulmonary hypertension is not about denying difficulty. It is about refusing to let the difficulty be the only thing. It is about insisting — quietly, persistently, night after night — on also seeing the other things. The faithful things. The things that kept working when keeping working was hard.", "Your body is one of those things. Tonight, as you move toward sleep, let it be accompanied by that recognition.", "BREATH_OUT:And breathe out... completely and slowly... and rest...", "Gently now — this session is complete. Sleep well, warrior. Your body will keep watch through the night."], "introCount": 8}, {"title": "I Showed Up — That Is Enough", "duration": "12 minutes", "paragraphs": ["Before we begin, I want you to do one small thing, with me.", "Stop. Just for a moment, stop, wherever your mind has been.", "It does not matter where it was — in tomorrow's worries, in something unfinished, in a conversation that is still replaying. Whatever it was holding, it can wait. Just for these few minutes, it can wait.", "Now, look around you, slowly. Notice what you can see, without judging any of it. Notice what you can hear, near you, and far away. Feel the surface beneath you, solid, and steady, and real.", "You are here. And right now, in this moment, nothing else is required of you. Not one single thing.", "These next minutes belong entirely to you. Not to the illness, not to anyone who needs something from you. Only to you.", "Your mind will wander during this session. That is normal, and it is not failure. When it wanders, simply notice, and bring it back here. It will wander again — and again, you bring it back. Every single time, gently, and without any frustration.", "You are worth this time. Let us begin.", "Good evening.", "Before you close this day, I want to say something to you that the day itself probably did not say.", "You showed up today. And that is enough.", "Not almost enough. Not enough considering your circumstances. Enough. Fully, completely, without qualification, without conditions attached.", "Come and rest now. Let your body find its stillness for the night. Let your weight settle into whatever is holding you. Let your hands open and release everything they have been holding.", "There is nothing left to do tonight. The day's work is finished. Whatever remains undone will still be there tomorrow, and tomorrow's version of you will meet it. But that is tomorrow. Tonight belongs to rest.", "BREATH_IN:Take a long, slow breath in... feel the quietness of this evening arriving around you...", "BREATH_OUT:And breathe out slowly and completely... let the last of the day's tension leave with this breath...", "I also want to acknowledge something that the culture of productivity makes very difficult to acknowledge — that some days, the bravest thing you can do is not push harder. Some days the bravest thing is to recognize your limit and respect it. To say: this is what today can hold, and this is where today ends.", "That kind of discernment — knowing when to continue and when to stop, when to give more and when to protect what remains — is not weakness. It is the wisdom of someone who has learned, through experience, what their body actually needs.", "You have developed that wisdom. It took time and it took difficulty and it took paying careful attention to what your body was telling you. And when you honor it — when you stop rather than push past the limit — you are practicing one of the most important forms of self-respect available to you.", "Tonight you stopped. You chose rest. That was not a failure of productivity. That was an act of wisdom and care.", "I want you to think honestly about today. Not to assess it against some ideal. Not to grade yourself. Not to compare this day to the day you wish you had been able to have.", "Just to see it clearly, as it actually was.", "You woke up this morning carrying something that most people around you are not carrying. A body that requires more management, more attention, more daily calculation than the bodies of the people sitting next to you at work, or standing in the queue, or going about their ordinary days without any of this complexity.", "You navigated that from the moment you woke. The medications. The awareness of how you were feeling before you had even gotten out of bed. The quiet internal calculation of what the day could hold and what it might cost you. The decisions — made quickly, almost automatically, from years of experience — about what to attempt and what to protect yourself from.", "And then you lived the day. With all of that as your foundation. However it went.", "Perhaps today was a good day — one where your body cooperated, where you had more energy than usual, where something felt easier than it has been. Those days are worth celebrating, even quietly, even just in this private moment before sleep.", "Perhaps today was hard. One of those days where everything cost more than it should have. Where getting through felt like the whole achievement, and it was right to feel that way, because getting through was genuinely everything.", "Perhaps it was somewhere in between, which is where most days live. Part cooperation, part resistance. Part ease, part effort.", "But you were there for it. Present. Engaged. Managing something invisibly complex while appearing, to most people, to simply be having an ordinary day.", "That is not the minimum. That is extraordinary.", "BREATH_IN:Breathe in slowly... let this breath carry genuine recognition of what you navigated today...", "BREATH_OUT:And breathe out... releasing any voice that says today was not enough... it was... you were...", "There is a cruelty in perfectionism that is especially sharp for people with chronic illness. The standards for what counts as a successful day — the things we measure ourselves against — were mostly set by people in full health, with full energy, without the daily management overhead that you carry.", "Those standards do not apply here. They never did.", "Let me offer you a different measure tonight. A more honest one.", "Did you take care of yourself today? Even imperfectly — did you try to honor what your body needed?", "Did you get through it? Even if getting through was the whole achievement?", "Were you present for at least one moment — one conversation, one small pleasure, one breath consciously taken?", "If you can say yes to even one of those, then today was enough. You were enough. Completely.", "BREATH_IN:Breathe in gently... breathe in the quiet, honest truth that you did what you could today...", "BREATH_OUT:And breathe out... let any remaining self-criticism dissolve completely... it has done whatever it needed to do... it can go now...", "Tomorrow will arrive. It will have its own demands, its own unexpected requirements. You will meet them the way you always meet them — imperfectly, faithfully, one moment at a time.", "But tonight belongs entirely to rest. To closing the day with the acknowledgment that it happened, and you were fully in it, and that is a complete and sufficient thing.", "BREATH_IN:One final breath in for this day... receive it as the gift it genuinely is...", "The word enough carries a weight that we rarely examine. Enough suggests a minimum, a floor, a bar that has been met. But tonight I want you to hear it differently. Enough as in complete. Enough as in whole. Enough as in nothing is missing.", "You were complete today. Nothing was missing from what you brought to it. And as the day ends, let that be the last thing you carry into sleep.", "BREATH_OUT:And breathe it slowly out... close the day gently with this breath...", "Gently now — this session is complete. You showed up today. That will always be enough. Sleep well, warrior."], "introCount": 8}, {"title": "Releasing The Fear I Carried Today", "duration": "12 minutes", "paragraphs": ["Before we begin, I want you to do one small thing, with me.", "Stop. Just for a moment, stop, wherever your mind has been.", "It does not matter where it was — in tomorrow's worries, in something unfinished, in a conversation that is still replaying. Whatever it was holding, it can wait. Just for these few minutes, it can wait.", "Now, look around you, slowly. Notice what you can see, without judging any of it. Notice what you can hear, near you, and far away. Feel the surface beneath you, solid, and steady, and real.", "You are here. And right now, in this moment, nothing else is required of you. Not one single thing.", "These next minutes belong entirely to you. Not to the illness, not to anyone who needs something from you. Only to you.", "Your mind will wander during this session. That is normal, and it is not failure. When it wanders, simply notice, and bring it back here. It will wander again — and again, you bring it back. Every single time, gently, and without any frustration.", "You are worth this time. Let us begin.", "Good evening.", "I want to ask you something tonight, and I want you to answer it honestly — not out loud, just inside yourself, in the private space where the truest answers live.", "What fear did you carry today?", "Not the fear you spoke about to anyone. Not the fear that has a clear name or a specific shape. The quiet one. The one that moved underneath the ordinary surface of the day like a current you can feel but cannot always see clearly.", "Perhaps it was the fear that something is slowly getting worse. The kind of fear that lives in the background and colors everything slightly, even when you are not consciously thinking about it. Perhaps it was the fear of an upcoming appointment — the waiting, the not-yet-knowing, the space between now and the result that the mind fills with its worst possibilities.", "Perhaps it was the smaller, more immediate fear — of being breathless in the wrong place, at the wrong time, in front of the wrong people. The fear of needing to stop when stopping is inconvenient or conspicuous. The fear of being seen as less capable than you want to be seen.", "Or perhaps it was the deeper, older fear. The one that does not have a clean edge. The one about time, and the future, and what this illness ultimately means for the shape of your life.", "You carried that today. Alongside everything else you carried. And tonight, before sleep, I want to help you set it down — not permanently, just for these hours.", "Find your stillness now. Let your body be completely held. Let the night surround you.", "BREATH_IN:Take a slow breath in through your nose... feel the quiet of this evening... the world settling into its nighttime stillness...", "BREATH_OUT:And breathe out slowly... a long, complete exhale... feel the grip of the day begin to loosen with each breath...", "There is something else worth saying about fear tonight. Something that gets lost in the noise of managing it day to day.", "You have been afraid before. Many times. Of many things, some of which came to pass and some of which did not. And every single time — without exception — you moved through it. The fear arrived, you carried it, and eventually the moment it was attached to either resolved or became something you learned to live alongside.", "That is your history with fear. A history of carrying it and continuing. A history that does not guarantee the future, but does tell you something true about what you are capable of.", "The fear you carried today is part of that history now. It came. You carried it. You are still here. And tonight you are choosing to set it down before sleep — which is itself a small act of courage, the courage of trusting that the night will be safe enough to rest in.", "I want to say something about fear before we go further, because it matters.", "Fear is not your enemy. It is not evidence that something is wrong with your mind or your resilience. Fear is information. Fear is your nervous system doing precisely what it evolved to do — scanning the environment, flagging uncertainty, trying to protect you from what might be coming.", "For someone with pulmonary hypertension, many of those fears are not irrational. They are an accurate reading of a situation that genuinely contains uncertainty and risk. The fear is responding to something real.", "So tonight we are not here to dismiss the fear, or to tell it that it was wrong to come, or to pretend it does not exist. We are here to say something different.", "We are here to say: you did your work today. You were present. You were heard. You flagged what needed to be flagged. And now — for these hours of sleep, in this safe place, in this body that will keep breathing through the night without needing your supervision — you can rest.", "The fear can rest too.", "BREATH_IN:Breathe in slowly... imagine breathing in something completely clean... air that has never been touched by worry...", "BREATH_OUT:And breathe out... and with this exhale, imagine releasing just one thread of what you carried today... just one... let it go into the night...", "Now — and this is important — think about a moment today that existed outside the fear. Something small, perhaps. A moment of ordinary comfort. A conversation that felt natural and easy. Food that tasted good. A window of quiet where the worry receded, even briefly, and you were simply present in a moment without dread.", "Those moments existed today. Even on the hard days — the days when fear is loudes
