<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PH Warrior Mind</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a1a;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;padding:24px}.card{background:linear-gradient(145deg,#1a1a2e,#16213e);border:1px solid rgba(100,160,255,0.2);border-radius:24px;padding:36px 28px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5)}.icon{font-size:56px;margin-bottom:16px}.title{color:#a8d8ff;font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;opacity:0.7}.session-name{color:#fff;font-size:22px;font-weight:600;margin-bottom:6px}.group-name{color:#7bafd4;font-size:13px;margin-bottom:32px}.progress-wrap{background:rgba(255,255,255,0.08);border-radius:10px;height:6px;margin-bottom:10px;cursor:pointer}.progress-bar{height:100%;background:linear-gradient(90deg,#4a9eff,#a78bfa);border-radius:10px;width:0%;transition:width 0.3s linear}.time-row{display:flex;justify-content:space-between;color:rgba(255,255,255,0.4);font-size:12px;margin-bottom:32px}.controls{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:28px}.btn-play{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#4a9eff,#a78bfa);border:none;color:white;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(74,158,255,0.4)}.btn-secondary{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.6);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}.status{color:rgba(255,255,255,0.35);font-size:12px;letter-spacing:1px}.playing{color:#4ade80}.error{color:#f87171}.loading{color:#f0a500}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,158,255,0.4)}70%{box-shadow:0 0 0 20px rgba(74,158,255,0)}100%{box-shadow:0 0 0 0 rgba(74,158,255,0)}}.pulsing{animation:pulse 2s infinite}</style></head><body><div class="card"><div class="icon">🌅</div><div class="title">PH Warrior Mind</div><div class="session-name">Morning Grounding</div><div class="group-name">Morning Awakening • Session 1</div><div class="progress-wrap" id="pw"><div class="progress-bar" id="pb"></div></div><div class="time-row"><span id="ct">0:00</span><span id="tt">0:49</span></div><div class="controls"><button class="btn-secondary" onclick="skip(-10)">⏪</button><button class="btn-play" id="playBtn" onclick="toggle()">▶</button><button class="btn-secondary" onclick="skip(10)">⏩</button></div><div class="status" id="st">TAP TO PLAY</div></div><audio id="a" src="session1.mp3" preload="auto"></audio><script>var a=document.getElementById('a'),pb=document.getElementById('pb'),ct=document.getElementById('ct'),tt=document.getElementById('tt'),st=document.getElementById('st'),btn=document.getElementById('playBtn'),playing=false;function fmt(s){var m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec;}a.addEventListener('timeupdate',function(){if(a.duration){pb.style.width=(a.currentTime/a.duration*100)+'%';ct.textContent=fmt(a.currentTime);tt.textContent=fmt(a.duration);}});a.addEventListener('ended',function(){playing=false;btn.textContent='▶';btn.classList.remove('pulsing');st.textContent='SESSION COMPLETE';st.className='status';pb.style.width='0%';a.currentTime=0;});a.addEventListener('error',function(){st.textContent='ERROR LOADING AUDIO';st.className='status error';});function toggle(){if(playing){a.pause();playing=false;btn.textContent='▶';btn.classList.remove('pulsing');st.textContent='PAUSED';st.className='status';}else{a.play().then(function(){playing=true;btn.textContent='⏸';btn.classList.add('pulsing');st.textContent='NOW PLAYING';st.className='status playing';}).catch(function(){st.textContent='TAP AGAIN';st.className='status error';});}}function skip(s){a.currentTime=Math.max(0,Math.min(a.duration||49,a.currentTime+s));}document.getElementById('pw').addEventListener('click',function(e){if(a.duration){var r=e.currentTarget.getBoundingClientRect();a.currentTime=((e.clientX-r.left)/r.width)*a.duration;}});</script></body></html>
